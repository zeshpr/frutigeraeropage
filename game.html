<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aero Dream OS - Ultimate Mobile</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #a4cbdc 0%, #d6e4ed 50%, #b8d1e0 100%);
            font-family: 'Segoe UI', 'Tahoma', sans-serif;
            user-select: none;
            height: 100vh;
            /* Важно для мобилок: отключаем свайпы и зум */
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }

        .flash { background: white !important; transition: background 0.1s; }

        .aero-window {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 12px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
            width: 380px;
            max-width: 90%; /* Адаптивность ширины */
            pointer-events: auto;
            animation: fadeIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

        .title-bar {
            padding: 10px 15px;
            background: rgba(255,255,255,0.3);
            border-bottom: 1px solid rgba(255,255,255,0.2);
            font-size: 13px;
            color: #1a4a7a;
            display: flex;
            justify-content: space-between;
            border-radius: 12px 12px 0 0;
        }

        .content { padding: 25px; text-align: center; }
        h1 { font-weight: 300; margin: 0 0 15px 0; color: #003366; }

        select {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #adc5d4;
            border-radius: 8px;
            background: rgba(255,255,255,0.9);
            font-size: 16px; /* Чтобы iOS не зумил инпут */
        }

        .btn-stack { display: flex; flex-direction: column; gap: 12px; }

        .aero-btn {
            background: linear-gradient(180deg, #fdfdfd 0%, #eeeeee 48%, #e0e0e0 50%, #dcdcdc 100%);
            border: 1px solid #8e9cad;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            color: #1d344f;
            font-weight: 500;
            box-shadow: inset 0 1px 0 white;
            transition: 0.2s;
        }
        .aero-btn:active { transform: scale(0.98); background: #d0d0d0; }

        #ui-layer {
            position: absolute; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            z-index: 100; pointer-events: none;
        }

        #hud {
            position: absolute; top: 15px; left: 50%;
            transform: translateX(-50%); /* Центрируем счет на мобилках */
            color: #1a4a7a; font-size: 18px; font-weight: bold;
            z-index: 50; display: none;
            background: rgba(255,255,255,0.5);
            padding: 8px 25px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.4);
        }

        canvas { position: absolute; top: 0; left: 0; display: block; }
        #game-canvas { z-index: 10; touch-action: none; }
    </style>
</head>
<body>

<div id="ui-layer">
    <div class="aero-window" id="menu">
        <div class="title-bar"><span>Aero Shell v1.1</span><span>✕</span></div>
        <div class="content">
            <h1>Aero Dream</h1>
            <label style="font-size: 13px; color: #555;">Музыкальное сопровождение:</label>
            <select id="music-list"></select>
            <div class="btn-stack">
                <button class="aero-btn" onclick="startGame()">Начать сеанс</button>
                <button class="aero-btn" onclick="window.location.reload()">Перезагрузить</button>
            </div>
        </div>
    </div>

    <div class="aero-window" id="game-over" style="display:none">
        <div class="title-bar"><span>Системное прерывание</span><span>✕</span></div>
        <div class="content">
            <h2 style="color:#1a4a7a; font-weight: normal;">Конец сессии</h2>
            <p>Ваш результат: <span id="final-score" style="font-size: 24px; font-weight:bold">0</span></p>
            <div class="btn-stack">
                <button class="aero-btn" onclick="startGame()">Играть снова</button>
                <button class="aero-btn" onclick="backToMenu()">В меню</button>
            </div>
        </div>
    </div>
</div>

<div id="hud">Score: <span id="score-val">0</span></div>
<canvas id="bg-canvas"></canvas>
<canvas id="game-canvas"></canvas>
<audio id="player-audio" loop></audio>

<script>
    const playlist = [
        { name: "Тишина", src: "" },
        { name: "Aero Atmosphere", src: "gamebg.mp3" },
    ];

    const musicList = document.getElementById('music-list');
    playlist.forEach((t, i) => {
        let opt = document.createElement('option');
        opt.value = i; opt.innerText = t.name;
        musicList.appendChild(opt);
    });

    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    const bgCanvas = document.getElementById('bg-canvas');
    const bgCtx = bgCanvas.getContext('2d');
    const audio = document.getElementById('player-audio');

    let w, h, score = 0, active = false, difficulty = 1;
    let orbs = [], bubbles = [];
    let mouse = { x: 0, y: 0 };
    let isTouch = false;

    function resize() {
        w = window.innerWidth; h = window.innerHeight;
        // Для четкости на телефонах
        const dpr = window.devicePixelRatio || 1;
        canvas.width = w * dpr; canvas.height = h * dpr;
        bgCanvas.width = w * dpr; bgCanvas.height = h * dpr;
        ctx.scale(dpr, dpr);
        bgCtx.scale(dpr, dpr);
        canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
        bgCanvas.style.width = w + 'px'; bgCanvas.style.height = h + 'px';
        mouse.x = w/2; mouse.y = h/2;
    }
    window.addEventListener('resize', resize);
    resize();

    // Универсальное управление
    const updateMouse = (x, y, isTouchMode) => {
        isTouch = isTouchMode;
        mouse.x = x;
        // На мобильных поднимаем шар чуть выше пальца, чтобы его было видно
        mouse.y = isTouchMode ? y - 40 : y;
    };

    window.addEventListener('mousemove', e => updateMouse(e.clientX, e.clientY, false));
    window.addEventListener('touchmove', e => {
        updateMouse(e.touches[0].clientX, e.touches[0].clientY, true);
    }, { passive: false });

    function triggerFlash() {
        document.body.classList.add('flash');
        setTimeout(() => document.body.classList.remove('flash'), 100);
    }

    function startGame() {
        document.getElementById('menu').style.display = 'none';
        document.getElementById('game-over').style.display = 'none';
        document.getElementById('hud').style.display = 'block';
        
        const track = playlist[musicList.value];
        if(track.src) { audio.src = track.src; audio.play().catch(()=>{}); }

        score = 0; difficulty = 1;
        orbs = [];
        document.getElementById('score-val').innerText = '0';
        active = true;
        loop();
    }

    function backToMenu() {
        active = false;
        audio.pause();
        document.getElementById('game-over').style.display = 'none';
        document.getElementById('menu').style.display = 'block';
        document.getElementById('hud').style.display = 'none';
    }

    class Orb {
        constructor(bad) {
            this.bad = bad;
            this.r = bad ? 18 : 14;
            this.x = Math.random() * w;
            this.y = Math.random() < 0.5 ? -40 : h + 40;
            this.vx = (Math.random() - 0.5) * 2;
            this.vy = (this.y < 0 ? 1 : -1) * (Math.random() * 1.5 + 1.2) * difficulty;
        }
        draw() {
            ctx.beginPath();
            let g = ctx.createRadialGradient(this.x-this.r/3, this.y-this.r/3, 2, this.x, this.y, this.r);
            if(this.bad) {
                g.addColorStop(0, '#ff9999'); g.addColorStop(1, '#aa0000');
            } else {
                g.addColorStop(0, '#e0f7ff'); g.addColorStop(0.4, '#3498db'); g.addColorStop(1, '#2980b9');
            }
            ctx.fillStyle = g;
            ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
            ctx.fill();
            // Блик
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.beginPath(); 
            ctx.ellipse(this.x-this.r/3, this.y-this.r/3, this.r/2, this.r/4, Math.PI/4, 0, Math.PI*2); 
            ctx.fill();
        }
    }

    function loop() {
        if(!active) return;
        requestAnimationFrame(loop);
        ctx.clearRect(0,0,w,h);

        // Спавн
        if(Math.random() < 0.04) orbs.push(new Orb(false));
        if(Math.random() < 0.008 * difficulty) orbs.push(new Orb(true));

        for(let i=orbs.length-1; i>=0; i--) {
            let o = orbs[i];
            o.x += o.vx; o.y += o.vy;
            o.draw();

            let d = Math.hypot(mouse.x - o.x, mouse.y - o.y);
            // Увеличиваем радиус поглощения для удобства на мобильных
            let hitBox = isTouch ? o.r + 20 : o.r + 14;

            if(d < hitBox) {
                if(o.bad) {
                    active = false;
                    document.getElementById('game-over').style.display = 'block';
                    document.getElementById('final-score').innerText = score;
                } else {
                    score += 10;
                    if(score % 200 === 0) triggerFlash();
                    difficulty += 0.008;
                    document.getElementById('score-val').innerText = score;
                    orbs.splice(i, 1);
                }
            }
            if(o.y < -150 || o.y > h+150 || o.x < -150 || o.x > w+150) orbs.splice(i,1);
        }

        // Игрок
        ctx.save();
        ctx.shadowBlur = 20; 
        ctx.shadowColor = 'rgba(255,255,255,0.8)';
        let pG = ctx.createRadialGradient(mouse.x-4, mouse.y-4, 2, mouse.x, mouse.y, 16);
        pG.addColorStop(0, '#ffffff'); 
        pG.addColorStop(1, 'rgba(200,230,255,0.8)');
        ctx.fillStyle = pG;
        ctx.beginPath();
        ctx.arc(mouse.x, mouse.y, 16, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
    }

    // Фон
    const bubbleCount = w < 600 ? 10 : 20;
    for(let i=0; i<bubbleCount; i++) bubbles.push({x: Math.random()*w, y: Math.random()*h, r: Math.random()*40+10, s: Math.random()*0.2+0.05});
    
    function drawBg() {
        bgCtx.clearRect(0,0,w,h);
        bubbles.forEach(b => {
            b.y -= active ? b.s * 2 : b.s;
            if(b.y < -100) { b.y = h+100; b.x = Math.random()*w; }
            bgCtx.beginPath();
            bgCtx.fillStyle = "rgba(255,255,255,0.1)";
            bgCtx.arc(b.x, b.y, b.r, 0, Math.PI*2);
            bgCtx.fill();
            bgCtx.strokeStyle = "rgba(255,255,255,0.15)";
            bgCtx.stroke();
        });
        requestAnimationFrame(drawBg);
    }
    drawBg();
</script>
</body>
</html>
