<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bubbles — social network</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --blue: #54c8f5;
    --blue-dark: #218fc5;
    --cyan: #bdf5ff;
    --white: rgba(255,255,255,.88);
    --glass: rgba(255,255,255,.72);
    --glass-strong: rgba(255,255,255,.9);
    --text: #22566d;
    --muted: #6691a4;
    --green: #63d6a1;
    --pink: #f39dcc;
    --shadow: 0 10px 30px rgba(24,122,163,.18);
}

html,
body {
    margin: 0;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    color: var(--text);
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    background:
        radial-gradient(circle at 10% 10%, rgba(255,255,255,.95), transparent 25%),
        radial-gradient(circle at 90% 15%, rgba(255,255,255,.8), transparent 22%),
        linear-gradient(180deg, #8ee8ff 0%, #d9faff 45%, #b7f2e8 100%);
}

/* decorative bubbles */

.sky-bubble {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: -1;
    background: radial-gradient(circle at 30% 25%,
        rgba(255,255,255,.95),
        rgba(255,255,255,.3) 35%,
        rgba(255,255,255,.08) 65%);
    border: 1px solid rgba(255,255,255,.7);
    box-shadow:
        inset -10px -12px 20px rgba(65,180,220,.08),
        0 8px 25px rgba(255,255,255,.2);
    animation: float 8s ease-in-out infinite;
}

.b1 { width: 110px; height: 110px; left: 4%; top: 18%; }
.b2 { width: 55px; height: 55px; right: 10%; top: 25%; animation-delay: -2s; }
.b3 { width: 150px; height: 150px; right: -30px; bottom: 8%; animation-delay: -4s; }
.b4 { width: 70px; height: 70px; left: 15%; bottom: 7%; animation-delay: -1s; }

@keyframes float {
    0%,100% { transform: translateY(0) rotate(0); }
    50% { transform: translateY(-22px) rotate(5deg); }
}

/* AUTH */

#authScreen {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

.auth-card {
    width: min(460px, 100%);
    background: var(--glass);
    backdrop-filter: blur(20px);
    border: 2px solid rgba(255,255,255,.75);
    border-radius: 35px;
    box-shadow: var(--shadow);
    padding: 35px;
}

.logo {
    text-align: center;
    font-size: 55px;
    font-weight: 900;
    letter-spacing: -4px;
    color: #fff;
    text-shadow:
        0 3px 0 #35a8d7,
        0 6px 15px rgba(28,120,160,.25);
}

.logo span {
    color: #f7ffff;
}

.subtitle {
    text-align: center;
    color: var(--muted);
    margin: 4px 0 28px;
}

.auth-tabs {
    display: flex;
    gap: 8px;
    padding: 6px;
    border-radius: 18px;
    background: rgba(80,190,225,.12);
    margin-bottom: 20px;
}

.auth-tabs button {
    flex: 1;
}

input,
textarea,
select {
    width: 100%;
    border: 1px solid rgba(71,171,207,.25);
    background: rgba(255,255,255,.8);
    color: var(--text);
    border-radius: 15px;
    padding: 13px 15px;
    outline: none;
    font: inherit;
    margin-bottom: 11px;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

input:focus,
textarea:focus,
select:focus {
    border-color: #55c8ee;
    box-shadow: 0 0 0 4px rgba(85,200,238,.12);
}

button {
    border: 0;
    border-radius: 15px;
    padding: 12px 17px;
    cursor: pointer;
    color: #226078;
    background: rgba(255,255,255,.82);
    box-shadow: 0 4px 12px rgba(35,130,165,.12);
    font-weight: 700;
    transition: .18s;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 7px 17px rgba(35,130,165,.18);
}

button:active {
    transform: translateY(0) scale(.98);
}

.primary {
    width: 100%;
    color: white;
    background: linear-gradient(180deg, #70dafb, #39addd);
}

.green {
    background: linear-gradient(180deg, #8ae6bd, #54c995);
    color: white;
}

.pink {
    background: linear-gradient(180deg, #f7b5d9, #e986bd);
    color: white;
}

.hidden {
    display: none !important;
}

.error {
    background: rgba(255,100,130,.13);
    color: #c95478;
    padding: 10px 13px;
    border-radius: 13px;
    margin-bottom: 12px;
    display: none;
}

/* APP */

#app {
    display: none;
}

.topbar {
    position: sticky;
    top: 0;
    z-index: 50;
    height: 72px;
    background: rgba(255,255,255,.74);
    backdrop-filter: blur(18px);
    border-bottom: 1px solid rgba(255,255,255,.8);
    box-shadow: 0 5px 20px rgba(28,120,160,.08);
}

.topbar-inner {
    max-width: 1250px;
    height: 100%;
    margin: auto;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 18px;
}

.mini-logo {
    font-size: 30px;
    font-weight: 900;
    color: white;
    text-shadow: 0 2px 0 #31a6d3;
    margin-right: 10px;
}

.search {
    flex: 1;
    max-width: 430px;
    position: relative;
}

.search input {
    margin: 0;
    padding-left: 42px;
    border-radius: 25px;
}

.search-icon {
    position: absolute;
    left: 15px;
    top: 11px;
}

.top-actions {
    display: flex;
    gap: 6px;
    margin-left: auto;
}

.icon-btn {
    min-width: 43px;
    padding: 10px;
}

.avatar-small {
    width: 43px;
    height: 43px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid white;
    box-shadow: 0 4px 12px rgba(30,120,160,.15);
    cursor: pointer;
}

.layout {
    width: min(1250px, calc(100% - 30px));
    margin: 25px auto 60px;
    display: grid;
    grid-template-columns: 210px minmax(0, 1fr) 250px;
    gap: 20px;
}

.sidebar,
.rightbar,
.card,
.post,
.profile-card,
.music-card,
.message-box {
    background: var(--glass);
    backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,.78);
    box-shadow: var(--shadow);
}

.sidebar {
    border-radius: 25px;
    padding: 12px;
    height: max-content;
    position: sticky;
    top: 95px;
}

.nav-btn {
    width: 100%;
    text-align: left;
    background: transparent;
    box-shadow: none;
    margin-bottom: 4px;
}

.nav-btn:hover,
.nav-btn.active {
    background: rgba(76,190,229,.16);
}

.nav-icon {
    display: inline-block;
    width: 28px;
}

.rightbar {
    border-radius: 25px;
    padding: 18px;
    height: max-content;
    position: sticky;
    top: 95px;
}

.page {
    min-width: 0;
}

.section-title {
    font-size: 27px;
    margin: 0 0 15px;
}

.card,
.post,
.music-card,
.message-box {
    border-radius: 25px;
    padding: 18px;
    margin-bottom: 17px;
}

/* FEED */

.create-post textarea {
    min-height: 80px;
}

.create-tools {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
}

.create-tools button {
    white-space: nowrap;
}

.post-image {
    display: block;
    width: 100%;
    max-height: 600px;
    object-fit: cover;
    border-radius: 20px;
    margin-top: 13px;
}

.post-head {
    display: flex;
    gap: 12px;
    align-items: center;
}

.post-avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid white;
}

.post-author {
    cursor: pointer;
    font-weight: 800;
}

.post-time {
    font-size: 12px;
    color: #8aa9b7;
}

.post-text {
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    margin: 15px 0;
}

.post-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    border-top: 1px solid rgba(50,150,180,.12);
    padding-top: 12px;
}

.like.active {
    color: #e85e9f;
    background: rgba(240,130,185,.15);
}

.comments {
    margin-top: 12px;
}

.comment {
    padding: 8px 12px;
    background: rgba(255,255,255,.48);
    border-radius: 14px;
    margin-top: 6px;
    overflow-wrap: anywhere;
}

.comment-form {
    display: flex;
    gap: 6px;
    margin-top: 9px;
}

.comment-form input {
    margin: 0;
}

.comment-form button {
    flex-shrink: 0;
}

/* PROFILE */

.profile-cover {
    height: 220px;
    border-radius: 25px 25px 0 0;
    background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.9), transparent 16%),
        linear-gradient(135deg, #75dbfa, #b0f4ec 55%, #83dfc4);
    background-size: cover;
    background-position: center;
    position: relative;
    overflow: hidden;
}

.profile-cover::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
        radial-gradient(circle at 75% 30%, rgba(255,255,255,.45) 0 35px, transparent 36px),
        radial-gradient(circle at 85% 65%, rgba(255,255,255,.25) 0 55px, transparent 56px);
}

.profile-info {
    padding: 0 22px 22px;
    position: relative;
}

.profile-big-avatar {
    width: 125px;
    height: 125px;
    object-fit: cover;
    border-radius: 50%;
    border: 6px solid rgba(255,255,255,.95);
    margin-top: -65px;
    position: relative;
    z-index: 2;
    background: #d9faff;
}

.profile-name {
    font-size: 28px;
    font-weight: 900;
    margin-top: 10px;
    overflow-wrap: anywhere;
}

.profile-username {
    color: #6b98aa;
}

.profile-bio {
    margin: 10px 0;
    line-height: 1.5;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.profile-stats {
    display: flex;
    gap: 25px;
    margin-top: 14px;
    flex-wrap: wrap;
}

.stat b {
    display: block;
    font-size: 20px;
}

.stat span {
    color: #759aaa;
    font-size: 13px;
}

.profile-buttons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 15px;
}

/* FRIENDS */

.user-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 13px;
}

.user-card {
    background: rgba(255,255,255,.6);
    border-radius: 20px;
    padding: 14px;
    display: flex;
    gap: 12px;
    align-items: center;
    min-width: 0;
}

.user-card img {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
}

.user-card-info {
    min-width: 0;
    flex: 1;
}

.user-card-name {
    font-weight: 800;
    overflow-wrap: anywhere;
}

.user-card-username {
    color: #759aaa;
    font-size: 13px;
    overflow-wrap: anywhere;
}

/* MUSIC */

.music-cover {
    width: 75px;
    height: 75px;
    object-fit: cover;
    border-radius: 17px;
    background: linear-gradient(135deg, #7bdff9, #f5b4db);
    flex-shrink: 0;
}

.music-row {
    display: flex;
    gap: 15px;
    align-items: center;
}

.music-info {
    min-width: 0;
    flex: 1;
}

.music-title {
    font-weight: 900;
    font-size: 17px;
    overflow-wrap: anywhere;
}

.music-artist {
    color: #759aaa;
    font-size: 13px;
    overflow-wrap: anywhere;
}

audio {
    width: 100%;
    margin-top: 12px;
}

/* MESSAGES */

.messages-layout {
    display: grid;
    grid-template-columns: 260px minmax(0,1fr);
    min-height: 600px;
    overflow: hidden;
    border-radius: 25px;
}

.conversations {
    background: rgba(255,255,255,.45);
    padding: 10px;
    border-right: 1px solid rgba(40,150,180,.1);
    overflow-y: auto;
}

.conversation {
    padding: 11px;
    border-radius: 16px;
    cursor: pointer;
    display: flex;
    gap: 9px;
    align-items: center;
    margin-bottom: 5px;
}

.conversation:hover,
.conversation.active {
    background: rgba(75,190,225,.15);
}

.conversation img {
    width: 43px;
    height: 43px;
    border-radius: 50%;
    object-fit: cover;
}

.chat {
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.chat-header {
    padding: 15px;
    border-bottom: 1px solid rgba(40,150,180,.1);
    font-weight: 800;
}

.chat-messages {
    flex: 1;
    padding: 17px;
    overflow-y: auto;
    max-height: 450px;
}

.message {
    max-width: 75%;
    width: fit-content;
    background: rgba(255,255,255,.7);
    padding: 10px 14px;
    border-radius: 18px 18px 18px 5px;
    margin-bottom: 9px;
    overflow-wrap: anywhere;
}

.message.mine {
    margin-left: auto;
    background: rgba(92,207,245,.35);
    border-radius: 18px 18px 5px 18px;
}

.chat-form {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid rgba(40,150,180,.1);
}

.chat-form input {
    margin: 0;
}

/* EDIT PROFILE */

.file-preview {
    width: 100%;
    max-height: 180px;
    object-fit: cover;
    border-radius: 18px;
    margin: 5px 0 13px;
    display: none;
}

/* EMPTY */

.empty {
    padding: 40px 20px;
    text-align: center;
    color: #759aaa;
}

.empty-icon {
    font-size: 45px;
    margin-bottom: 8px;
}

/* TOAST */

.toast {
    position: fixed;
    right: 20px;
    bottom: 20px;
    background: rgba(255,255,255,.94);
    border: 1px solid white;
    box-shadow: var(--shadow);
    border-radius: 17px;
    padding: 13px 17px;
    z-index: 100;
    transform: translateY(120px);
    opacity: 0;
    transition: .25s;
}

.toast.show {
    transform: translateY(0);
    opacity: 1;
}

/* MOBILE */

@media (max-width: 1050px) {
    .layout {
        grid-template-columns: 185px minmax(0,1fr);
    }

    .rightbar {
        display: none;
    }
}

@media (max-width: 720px) {
    .topbar {
        height: auto;
    }

    .topbar-inner {
        flex-wrap: wrap;
        padding: 9px 12px;
    }

    .mini-logo {
        font-size: 26px;
    }

    .search {
        order: 3;
        flex-basis: 100%;
        max-width: none;
    }

    .top-actions {
        margin-left: auto;
    }

    .layout {
        width: calc(100% - 14px);
        margin-top: 10px;
        display: block;
    }

    .sidebar {
        position: static;
        display: flex;
        overflow-x: auto;
        padding: 7px;
        border-radius: 18px;
        margin-bottom: 12px;
        gap: 4px;
    }

    .nav-btn {
        width: auto;
        white-space: nowrap;
        margin: 0;
    }

    .nav-btn span:not(.nav-icon) {
        display: none;
    }

    .card,
    .post,
    .music-card {
        border-radius: 20px;
        padding: 14px;
    }

    .profile-cover {
        height: 160px;
    }

    .profile-big-avatar {
        width: 100px;
        height: 100px;
        margin-top: -50px;
    }

    .profile-info {
        padding: 0 15px 18px;
    }

    .messages-layout {
        grid-template-columns: 1fr;
    }

    .conversations {
        max-height: 160px;
        border-right: 0;
        border-bottom: 1px solid rgba(40,150,180,.1);
    }

    .chat-messages {
        max-height: 400px;
    }
}

@media (max-width: 450px) {
    .logo {
        font-size: 45px;
    }

    .auth-card {
        padding: 22px;
        border-radius: 27px;
    }

    .top-actions .icon-btn:nth-child(2) {
        display: none;
    }

    .profile-stats {
        gap: 15px;
    }
}
</style>
</head>

<body>

<div class="sky-bubble b1"></div>
<div class="sky-bubble b2"></div>
<div class="sky-bubble b3"></div>
<div class="sky-bubble b4"></div>

<!-- AUTH -->

<section id="authScreen">

    <div class="auth-card">

        <div class="logo">bubbles</div>
        <div class="subtitle">a little place on the internet</div>

        <div class="auth-tabs">
            <button id="loginTab" onclick="showAuth('login')">Войти</button>
            <button id="registerTab" onclick="showAuth('register')">Создать аккаунт</button>
        </div>

        <div id="authError" class="error"></div>

        <form id="loginForm">
            <input id="loginUsername" placeholder="Username" autocomplete="username" required>
            <input id="loginPassword" type="password" placeholder="Пароль" autocomplete="current-password" required>
            <button class="primary" type="submit">Войти в bubbles</button>
        </form>

        <form id="registerForm" class="hidden">

            <input id="regUsername" placeholder="Username" maxlength="25" required>

            <input id="regDisplayName" placeholder="Имя, которое увидят другие" maxlength="35" required>

            <select id="regGender" required>
                <option value="">Пол</option>
                <option value="male">Мужской</option>
                <option value="female">Женский</option>
            </select>

            <textarea
                id="regBio"
                maxlength="160"
                placeholder="Немного о себе..."
            ></textarea>

            <input
                id="regPassword"
                type="password"
                placeholder="Пароль"
                minlength="4"
                required
            >

            <button class="primary" type="submit">Создать bubbles</button>

        </form>

    </div>

</section>


<!-- APP -->

<div id="app">

    <header class="topbar">

        <div class="topbar-inner">

            <div class="mini-logo">bubbles</div>

            <div class="search">
                <span class="search-icon">🔎</span>
                <input
                    id="searchInput"
                    placeholder="Найти людей, посты..."
                    oninput="searchEverything(this.value)"
                >
            </div>

            <div class="top-actions">
                <button class="icon-btn" onclick="openPage('messages')">💌</button>
                <button class="icon-btn" onclick="openPage('friends')">👥</button>
                <button class="icon-btn" onclick="openPage('music')">🎵</button>

                <img
                    id="topAvatar"
                    class="avatar-small"
                    onclick="openOwnProfile()"
                    alt="avatar"
                >
            </div>

        </div>

    </header>


    <div class="layout">

        <!-- NAV -->

        <aside class="sidebar">

            <button class="nav-btn active" data-page="feed" onclick="openPage('feed')">
                <span class="nav-icon">🏠</span><span>Лента</span>
            </button>

            <button class="nav-btn" data-page="profile" onclick="openOwnProfile()">
                <span class="nav-icon">👤</span><span>Профиль</span>
            </button>

            <button class="nav-btn" data-page="friends" onclick="openPage('friends')">
                <span class="nav-icon">👥</span><span>Друзья</span>
            </button>

            <button class="nav-btn" data-page="messages" onclick="openPage('messages')">
                <span class="nav-icon">💌</span><span>Сообщения</span>
            </button>

            <button class="nav-btn" data-page="music" onclick="openPage('music')">
                <span class="nav-icon">🎵</span><span>Музыка</span>
            </button>

            <button class="nav-btn" data-page="edit" onclick="openPage('edit')">
                <span class="nav-icon">⚙️</span><span>Настройки</span>
            </button>

            <button
                class="nav-btn"
                onclick="window.location.href='https://zeshpr.github.io/frutigeraeropage/bubbling.html'"
            >
                <span class="nav-icon">🌐</span><span>На главную</span>
            </button>

            <button class="nav-btn" onclick="logout()">
                <span class="nav-icon">🚪</span><span>Выйти</span>
            </button>

        </aside>


        <!-- MAIN -->

        <main id="page" class="page"></main>


        <!-- RIGHT -->

        <aside class="rightbar">

            <h3 style="margin-top:0;">🌊 bubbles</h3>

            <p style="line-height:1.5;color:#7098a8;">
                Маленькая социальная сеть,
                которая выглядит так, будто интернет
                никогда не перестал быть добрым.
            </p>

            <hr style="border:0;border-top:1px solid rgba(50,150,180,.12);">

            <div id="onlineWidget"></div>

        </aside>

    </div>

</div>


<div id="toast" class="toast"></div>


<script>
/* ============================================================
   BUBBLES — LOCAL PROTOTYPE
   ============================================================ */

const DB_KEY = "bubbles_social_database_v4";
const SESSION_KEY = "bubbles_current_user_v4";

let db = loadDB();
let currentUserId = localStorage.getItem(SESSION_KEY);
let currentPage = "feed";
let selectedChatUser = null;


/* ============================================================
   DATABASE
   ============================================================ */

function loadDB() {

    try {
        const saved = localStorage.getItem(DB_KEY);

        if (saved) {
            const parsed = JSON.parse(saved);

            return {
                users: parsed.users || [],
                posts: parsed.posts || [],
                music: parsed.music || [],
                messages: parsed.messages || []
            };
        }

    } catch(e) {
        console.error(e);
    }

    return {
        users: [],
        posts: [],
        music: [],
        messages: []
    };
}


function saveDB() {
    localStorage.setItem(DB_KEY, JSON.stringify(db));
}


function saveSession() {
    if (currentUserId) {
        localStorage.setItem(SESSION_KEY, currentUserId);
    } else {
        localStorage.removeItem(SESSION_KEY);
    }
}


function uid(prefix = "id") {
    return prefix + "_" + Date.now() + "_" + Math.random().toString(36).slice(2,9);
}


function getUser(id) {
    return db.users.find(u => u.id === id);
}


function getCurrentUser() {
    return getUser(currentUserId);
}


function defaultAvatar(name = "B") {

    const letter = (name || "B").trim().charAt(0).toUpperCase();

    const svg = `
    <svg xmlns="http://www.w3.org/2000/svg" width="400" height="400">
        <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                <stop stop-color="#73dcfa"/>
                <stop offset="1" stop-color="#91e5c5"/>
            </linearGradient>
        </defs>
        <rect width="400" height="400" rx="200" fill="url(#g)"/>
        <circle cx="120" cy="100" r="55" fill="white" opacity=".35"/>
        <text x="200" y="245"
              text-anchor="middle"
              font-family="Arial"
              font-size="150"
              font-weight="bold"
              fill="white">${escapeSvg(letter)}</text>
    </svg>`;

    return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
}


function defaultCover() {
    return "";
}


/* ============================================================
   AUTH
   ============================================================ */

function showAuth(type) {

    document.getElementById("loginForm").classList.toggle("hidden", type !== "login");
    document.getElementById("registerForm").classList.toggle("hidden", type !== "register");

    document.getElementById("loginTab").classList.toggle("primary", type === "login");
    document.getElementById("registerTab").classList.toggle("primary", type === "register");

    hideError();
}


function showError(text) {
    const el = document.getElementById("authError");
    el.textContent = text;
    el.style.display = "block";
}


function hideError() {
    const el = document.getElementById("authError");
    el.textContent = "";
    el.style.display = "none";
}


document.getElementById("registerForm").addEventListener("submit", function(e) {

    e.preventDefault();

    const username = document.getElementById("regUsername").value.trim().toLowerCase();
    const displayName = document.getElementById("regDisplayName").value.trim();
    const gender = document.getElementById("regGender").value;
    const bio = document.getElementById("regBio").value.trim();
    const password = document.getElementById("regPassword").value;

    if (!/^[a-zA-Z0-9_.-]{3,25}$/.test(username)) {
        showError("Username: только латиница, цифры, _ . - и минимум 3 символа.");
        return;
    }

    if (db.users.some(u => u.username === username)) {
        showError("Такой username уже занят.");
        return;
    }

    const user = {
        id: uid("user"),
        username,
        displayName,
        gender,
        bio,
        password,
        avatar: defaultAvatar(displayName),
        cover: defaultCover(),
        friends: [],
        friendRequests: [],
        createdAt: Date.now()
    };

    db.users.push(user);
    saveDB();

    currentUserId = user.id;
    saveSession();

    document.getElementById("registerForm").reset();

    startApp();

    toast("Добро пожаловать в bubbles 🫧");
});


document.getElementById("loginForm").addEventListener("submit", function(e) {

    e.preventDefault();

    const username = document.getElementById("loginUsername").value.trim().toLowerCase();
    const password = document.getElementById("loginPassword").value;

    const user = db.users.find(
        u => u.username === username && u.password === password
    );

    if (!user) {
        showError("Неверный username или пароль.");
        return;
    }

    currentUserId = user.id;
    saveSession();

    document.getElementById("loginForm").reset();

    startApp();

    toast("С возвращением, " + user.displayName + " 🫧");
});


function logout() {

    currentUserId = null;
    saveSession();

    document.getElementById("app").style.display = "none";
    document.getElementById("authScreen").style.display = "flex";

    showAuth("login");
}


/* ============================================================
   APP START
   ============================================================ */

function startApp() {

    const user = getCurrentUser();

    if (!user) {
        logout();
        return;
    }

    document.getElementById("authScreen").style.display = "none";
    document.getElementById("app").style.display = "block";

    updateTopbar();

    openPage("feed");

    updateOnlineWidget();
}


function updateTopbar() {

    const user = getCurrentUser();

    if (!user) return;

    document.getElementById("topAvatar").src = user.avatar || defaultAvatar(user.displayName);
}


function openPage(page) {

    currentPage = page;

    document.querySelectorAll(".nav-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.page === page);
    });

    if (page === "feed") renderFeed();
    if (page === "profile") renderProfile(currentUserId);
    if (page === "friends") renderFriends();
    if (page === "messages") renderMessages();
    if (page === "music") renderMusic();
    if (page === "edit") renderEditProfile();
}


function openOwnProfile() {
    openPage("profile");
}


/* ============================================================
   FEED
   ============================================================ */

function renderFeed() {

    const page = document.getElementById("page");

    const posts = [...db.posts].sort((a,b) => b.createdAt - a.createdAt);

    page.innerHTML = `
        <h1 class="section-title">Лента 🌊</h1>

        <div class="card create-post">

            <textarea
                id="newPostText"
                maxlength="1000"
                placeholder="Что нового в твоём маленьком интернете?"
            ></textarea>

            <input
                type="file"
                id="postImageInput"
                accept="image/png,image/jpeg,image/webp,image/gif"
                hidden
            >

            <div class="create-tools">

                <button onclick="document.getElementById('postImageInput').click()">
                    📷 Фотография
                </button>

                <span id="postImageName" style="color:#7899a7;font-size:13px;"></span>

                <button class="primary" style="width:auto;margin-left:auto;" onclick="createPost()">
                    Опубликовать
                </button>

            </div>

        </div>

        <div id="feedPosts">
            ${
                posts.length
                ? posts.map(renderPost).join("")
                : emptyState("🫧", "Здесь пока тихо", "Создай первый пост в bubbles.")
            }
        </div>
    `;

    document.getElementById("postImageInput").addEventListener("change", function() {
        const file = this.files[0];
        document.getElementById("postImageName").textContent =
            file ? file.name : "";
    });
}


function createPost() {

    const text = document.getElementById("newPostText").value.trim();
    const input = document.getElementById("postImageInput");
    const file = input.files[0];

    if (!text && !file) {
        toast("Напиши что-нибудь или добавь фотографию.");
        return;
    }

    if (file && !file.type.startsWith("image/")) {
        toast("Можно загружать только изображения.");
        return;
    }

    const finish = image => {

        db.posts.push({
            id: uid("post"),
            authorId: currentUserId,
            text,
            image: image || "",
            likes: [],
            comments: [],
            createdAt: Date.now()
        });

        saveDB();
        renderFeed();
        toast("Пост опубликован 🫧");
    };

    if (file) {

        const reader = new FileReader();

        reader.onload = e => finish(e.target.result);

        reader.readAsDataURL(file);

    } else {
        finish("");
    }
}


function renderPost(post) {

    const author = getUser(post.authorId);

    if (!author) return "";

    const liked = post.likes.includes(currentUserId);

    const comments = post.comments || [];

    return `
        <article class="post">

            <div class="post-head">

                <img
                    class="post-avatar"
                    src="${author.avatar || defaultAvatar(author.displayName)}"
                    onclick="renderProfile('${author.id}')"
                    alt=""
                >

                <div style="min-width:0;">
                    <div
                        class="post-author"
                        onclick="renderProfile('${author.id}')"
                    >
                        ${escapeHtml(author.displayName)}
                    </div>

                    <div class="post-time">
                        @${escapeHtml(author.username)} · ${formatDate(post.createdAt)}
                    </div>
                </div>

            </div>

            ${
                post.text
                ? `<div class="post-text">${escapeHtml(post.text)}</div>`
                : ""
            }

            ${
                post.image
                ? `<img class="post-image" src="${post.image}" alt="post image">`
                : ""
            }

            <div class="post-actions">

                <button
                    class="like ${liked ? "active" : ""}"
                    onclick="toggleLike('${post.id}')"
                >
                    ${liked ? "💗" : "♡"} ${post.likes.length}
                </button>

                <button onclick="focusComment('${post.id}')">
                    💬 ${comments.length}
                </button>

                <button onclick="openProfileFromPost('${post.authorId}')">
                    👤 Профиль
                </button>

                ${
                    post.authorId === currentUserId
                    ? `<button onclick="deletePost('${post.id}')">🗑️</button>`
                    : ""
                }

            </div>

            <div class="comments">

                ${
                    comments.map(c => {

                        const user = getUser(c.userId);

                        return `
                            <div class="comment">
                                <b>@${escapeHtml(user?.username || "user")}</b>
                                ${escapeHtml(c.text)}
                            </div>
                        `;

                    }).join("")
                }

                <div class="comment-form">

                    <input
                        id="comment-${post.id}"
                        placeholder="Написать комментарий..."
                        maxlength="300"
                        onkeydown="if(event.key==='Enter') addComment('${post.id}')"
                    >

                    <button onclick="addComment('${post.id}')">➤</button>

                </div>

            </div>

        </article>
    `;
}


function toggleLike(postId) {

    const post = db.posts.find(p => p.id === postId);

    if (!post) return;

    if (post.likes.includes(currentUserId)) {
        post.likes = post.likes.filter(id => id !== currentUserId);
    } else {
        post.likes.push(currentUserId);
    }

    saveDB();
    renderFeed();
}


function addComment(postId) {

    const input = document.getElementById("comment-" + postId);

    if (!input) return;

    const text = input.value.trim();

    if (!text) return;

    const post = db.posts.find(p => p.id === postId);

    if (!post) return;

    post.comments.push({
        id: uid("comment"),
        userId: currentUserId,
        text,
        createdAt: Date.now()
    });

    saveDB();
    renderFeed();
}


function focusComment(postId) {

    const input = document.getElementById("comment-" + postId);

    if (input) {
        input.focus();
        input.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });
    }
}


function deletePost(id) {

    if (!confirm("Удалить этот пост?")) return;

    db.posts = db.posts.filter(p => p.id !== id);

    saveDB();
    renderFeed();

    toast("Пост удалён.");
}


function openProfileFromPost(id) {
    renderProfile(id);
}

function renderProfile(userId) {

    currentPage = "profile";

    const user = getUser(userId);

    if (!user) return;

    const own = user.id === currentUserId;

    const posts = db.posts
        .filter(p => p.authorId === user.id)
        .sort((a,b) => b.createdAt - a.createdAt);

    const userMusic = db.music
        .filter(m => m.authorId === user.id)
        .sort((a,b) => b.createdAt - a.createdAt);

    const friend = getCurrentUser()?.friends?.includes(user.id);

    const incoming = user.friendRequests?.includes(currentUserId);

    const coverStyle = user.cover
        ? `background-image:url("${user.cover}")`
        : "";

    document.getElementById("page").innerHTML = `

        <div class="profile-card">

            <div class="profile-cover" style="${coverStyle}"></div>

            <div class="profile-info">

                <img
                    class="profile-big-avatar"
                    src="${user.avatar || defaultAvatar(user.displayName)}"
                    alt=""
                >

                <div class="profile-name">
                    ${escapeHtml(user.displayName)}
                </div>

                <div class="profile-username">
                    @${escapeHtml(user.username)}
                </div>

                <div class="profile-bio">
                    ${escapeHtml(user.bio || "Этот пользователь пока ничего о себе не написал.")}
                </div>

                <div class="profile-stats">

                    <div class="stat">
                        <b>${user.friends?.length || 0}</b>
                        <span>друзей</span>
                    </div>

                    <div class="stat">
                        <b>${posts.length}</b>
                        <span>постов</span>
                    </div>

                    <div class="stat">
                        <b>${userMusic.length}</b>
                        <span>музыки</span>
                    </div>

                </div>

                <div class="profile-buttons">

                    ${
                        own
                        ? `
                            <button onclick="openPage('edit')">
                                ✏️ Редактировать
                            </button>
                        `
                        : `
                            ${
                                friend
                                ? `<button class="green" onclick="removeFriend('${user.id}')">✓ В друзьях</button>`
                                : incoming
                                ? `<button class="green" onclick="acceptFriend('${user.id}')">✓ Принять заявку</button>`
                                : `<button class="primary" style="width:auto" onclick="sendFriendRequest('${user.id}')">＋ Добавить в друзья</button>`
                            }

                            <button onclick="openChat('${user.id}')">
                                💌 Написать
                            </button>
                        `
                    }

            </div>

            userMusic.length

                    🎵 Музыка
                </h2>

                ${userMusic.map(renderMusicCard).join("")}

            posts.length

            : emptyState("🌊", "Пока нет постов", "Здесь появятся публикации пользователя.")
        }

    `;

    document.querySelectorAll(".nav-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.page === "profile");
    });
}


/* ============================================================
   FRIENDS
   ============================================================ */

function sendFriendRequest(userId) {

    const target = getUser(userId);
    const me = getCurrentUser();

    if (!target || !me || userId === currentUserId) return;

    if (!target.friendRequests) target.friendRequests = [];

    if (!target.friendRequests.includes(currentUserId)) {
        target.friendRequests.push(currentUserId);
    }

    saveDB();

    renderProfile(userId);

    toast("Заявка отправлена 👥");
}


function acceptFriend(userId) {

    const me = getCurrentUser();
    const other = getUser(userId);

    if (!me || !other) return;

    if (!me.friends) me.friends = [];
    if (!other.friends) other.friends = [];

    if (!me.friends.includes(userId)) me.friends.push(userId);
    if (!other.friends.includes(currentUserId)) other.friends.push(currentUserId);

    me.friendRequests = (me.friendRequests || [])
        .filter(id => id !== userId);

    saveDB();

    renderProfile(userId);

    toast("Теперь вы друзья 🫧");
}


function removeFriend(userId) {

    const me = getCurrentUser();
    const other = getUser(userId);

    if (!me || !other) return;

    me.friends = (me.friends || []).filter(id => id !== userId);
    other.friends = (other.friends || []).filter(id => id !== currentUserId);

    saveDB();

    renderProfile(userId);

    toast("Пользователь удалён из друзей.");
}


function renderFriends() {

    const me = getCurrentUser();

    const friends = (me.friends || [])
        .map(getUser)
        .filter(Boolean);

    const requests = (me.friendRequests || [])
        .map(getUser)
        .filter(Boolean);

    const others = db.users
        .filter(u => u.id !== currentUserId)
        .filter(u => !friends.some(f => f.id === u.id))
        .slice(0, 12);

    document.getElementById("page").innerHTML = `

        <h1 class="section-title">👥 Друзья</h1>

        ${
            requests.length
            ? `
                <div class="card">

                    <h3 style="margin-top:0;">
                        Новые заявки
                    </h3>

                    <div class="user-list">
                        ${requests.map(u => renderUserCard(u, true)).join("")}
                    </div>

                </div>
            `
            : ""
        }

        <div class="card">

            <h3 style="margin-top:0;">
                Мои друзья · ${friends.length}
            </h3>

            ${
                friends.length
                ? `<div class="user-list">${friends.map(u => renderUserCard(u)).join("")}</div>`
                : emptyState("👥", "Пока нет друзей", "Найди кого-нибудь через поиск.")
            }

        </div>

        <div class="card">

            <h3 style="margin-top:0;">
                Люди в bubbles
            </h3>

            ${
                others.length
                ? `<div class="user-list">${others.map(u => renderUserCard(u)).join("")}</div>`
                : emptyState("🫧", "Пока никого нет", "")
            }

        </div>

    `;
}


function renderUserCard(user, request = false) {

    const me = getCurrentUser();

    const isFriend = me?.friends?.includes(user.id);

    return `
        <div class="user-card">

            <img
                src="${user.avatar || defaultAvatar(user.displayName)}"
                onclick="renderProfile('${user.id}')"
            >

            <div class="user-card-info">

                <div
                    class="user-card-name"
                    onclick="renderProfile('${user.id}')"
                    style="cursor:pointer;"
                >
                    ${escapeHtml(user.displayName)}
                </div>

                <div class="user-card-username">
                    @${escapeHtml(user.username)}
                </div>

                <div style="margin-top:7px;display:flex;gap:5px;flex-wrap:wrap;">

                    ${
                        request
                        ? `<button class="green" onclick="acceptFriend('${user.id}')">Принять</button>`
                        : isFriend
                        ? `<button onclick="removeFriend('${user.id}')">Удалить</button>`
                        : `<button onclick="sendFriendRequest('${user.id}')">＋ Дружба</button>`
                    }

                </div>

            </div>

        </div>
    `;
}

function renderMusic() {

            >

            <input
                id="musicFile"
                type="file"
                accept=".mp3,audio/mpeg"
            >

            <button class="primary" style="width:auto;" onclick="uploadMusic()">
                🎵 Опубликовать MP3
            </button>

            <p style="font-size:12px;color:#7899a7;margin-bottom:0;">

            </p>

                : emptyState("🎵", "Музыки пока нет", "Загрузи первый трек в bubbles.")
            }

        </div>

    `;
}


function uploadMusic() {

    const title = document.getElementById("musicTitle").value.trim();
    const audioFile = document.getElementById("musicFile").files[0];
    const coverFile = document.getElementById("musicCover").files[0];

    if (!title) {
        toast("Укажи название трека.");
        return;
    }

    if (!audioFile) {
        toast("Выбери MP3-файл.");
        return;
    }

    const isMP3 =
        audioFile.type === "audio/mpeg" ||
        audioFile.name.toLowerCase().endsWith(".mp3");

    if (!isMP3) {
        toast("Можно загружать только MP3.");
        return;
    }

    const readFile = (file) => {

        return new Promise((resolve, reject) => {

            if (!file) {
                resolve("");
                return;
            }

            const reader = new FileReader();

            reader.onload = e => resolve(e.target.result);
            reader.onerror = reject;

            reader.readAsDataURL(file);
        });
    };


    Promise.all([
        readFile(audioFile),
        readFile(coverFile)
    ])
    .then(([audio, cover]) => {

        db.music.push({
            id: uid("music"),
            authorId: currentUserId,
            title,
            audio,
            cover: cover || "",
            createdAt: Date.now()
        });

        saveDB();

        openPage("music");

        toast("Трек опубликован 🎵");
    })
    .catch(() => {
        toast("Не удалось прочитать файл.");
    });
}


function renderMusicCard(music) {

    const author = getUser(music.authorId);

    return `
        <div class="music-card">

            <div class="music-row">

                <img
                    class="music-cover"
                    src="${music.cover || defaultMusicCover()}"
                    alt=""
                >

                <div class="music-info">

                    <div class="music-title">
                        ${escapeHtml(music.title)}
                    </div>

                    <div class="music-artist">
                        ${escapeHtml(author?.displayName || "Unknown")}
                        · @${escapeHtml(author?.username || "unknown")}
                    </div>

                </div>

                ${
                    music.authorId === currentUserId
                    ? `<button onclick="deleteMusic('${music.id}')">🗑️</button>`
                    : ""
                }

            </div>

            <audio controls preload="metadata" src="${music.audio}"></audio>

        </div>
    `;
}


function defaultMusicCover() {

    const svg = `
    <svg xmlns="http://www.w3.org/2000/svg" width="400" height="400">
        <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                <stop stop-color="#69d9f8"/>
                <stop offset=".5" stop-color="#b5f1df"/>
                <stop offset="1" stop-color="#f2a9d2"/>
            </linearGradient>
        </defs>
        <rect width="400" height="400" rx="40" fill="url(#g)"/>
        <circle cx="130" cy="120" r="60" fill="white" opacity=".35"/>
        <text x="200" y="245"
              text-anchor="middle"
              font-size="130">♪</text>
    </svg>`;

    return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
}


function deleteMusic(id) {

    if (!confirm("Удалить этот трек?")) return;

    db.music = db.music.filter(m => m.id !== id);

    saveDB();

    openPage("music");

    toast("Трек удалён.");
}

                    border-radius:50%;
                    margin:auto;
                    object-fit:cover;
                "
                src="${user.avatar}"
            >

            <input
                id="avatarFile"
                type="file"
                accept="image/png,image/jpeg,image/webp"
            >

            <p style="font-size:12px;color:#7899a7;">
                PNG, JPG или WebP.
            </p>

        </div>


        <div class="card">

            <h3 style="margin-top:0;">🌅 Обложка профиля</h3>

            <img
                id="coverPreview"
                class="file-preview"
                src="${user.cover || ""}"
                style="${user.cover ? "display:block;" : ""}"
            >

            <input
                id="coverFile"
                type="file"
                accept="image/png,image/jpeg,image/webp"
            >

        </div>


        <button
            class="primary"
            style="width:auto;"
            onclick="saveProfileChanges()"
        >
            💾 Сохранить изменения
        </button>

    `;


    document.getElementById("avatarFile").addEventListener("change", function() {

        const file = this.files[0];

        if (!file) return;

        if (!file.type.startsWith("image/")) {
            toast("Выбери изображение.");
            this.value = "";
            return;
        }

        const reader = new FileReader();

        reader.onload = e => {
            document.getElementById("avatarPreview").src = e.target.result;
            document.getElementById("avatarPreview").style.display = "block";
        };

        reader.readAsDataURL(file);
    });


    document.getElementById("coverFile").addEventListener("change", function() {

        const file = this.files[0];

        if (!file) return;

        if (!file.type.startsWith("image/")) {
            toast("Выбери изображение.");
            this.value = "";
            return;
        }

        const reader = new FileReader();

        reader.onload = e => {
            document.getElementById("coverPreview").src = e.target.result;
            document.getElementById("coverPreview").style.display = "block";
        };

        reader.readAsDataURL(file);
    });
}


function saveProfileChanges() {

    const user = getCurrentUser();

    const username = document
        .getElementById("editUsername")
        .value
        .trim()
        .toLowerCase();

    const displayName = document
        .getElementById("editDisplayName")
        .value
        .trim();

    const bio = document
        .getElementById("editBio")
        .value
        .trim();

    const gender = document
        .getElementById("editGender")
        .value;

    if (!/^[a-zA-Z0-9_.-]{3,25}$/.test(username)) {
        toast("Некорректный username.");
        return;
    }

    const duplicate = db.users.find(
        u => u.username === username && u.id !== user.id
    );

    if (duplicate) {
        toast("Такой username уже занят.");
        return;
    }

    user.username = username;
    user.displayName = displayName || username;
    user.bio = bio;
    user.gender = gender;

    const avatarFile = document.getElementById("avatarFile").files[0];
    const coverFile = document.getElementById("coverFile").files[0];

    const read = file => new Promise((resolve, reject) => {

        if (!file) {
            resolve(null);
            return;
        }

        const reader = new FileReader();

        reader.onload = e => resolve(e.target.result);
        reader.onerror = reject;

        reader.readAsDataURL(file);
    });


    Promise.all([
        read(avatarFile),
        read(coverFile)
    ])
    .then(([avatar, cover]) => {

        if (avatar) user.avatar = avatar;
        if (cover) user.cover = cover;

        saveDB();
        updateTopbar();

        renderProfile(user.id);

        toast("Профиль сохранён 🫧");
    });
}


/* ============================================================
   MESSAGES
   ============================================================ */

function openChat(userId) {

    selectedChatUser = userId;

    openPage("messages");
}


function renderMessages() {

    const me = getCurrentUser();

    const otherUsers = db.users
        .filter(u => u.id !== currentUserId)
        .filter(u =>
            db.messages.some(m =>
                (m.from === currentUserId && m.to === u.id) ||
                (m.from === u.id && m.to === currentUserId)
            )
        );

    if (!selectedChatUser && otherUsers.length) {
        selectedChatUser = otherUsers[0].id;
    }

    document.getElementById("page").innerHTML = `

        <h1 class="section-title">💌 Сообщения</h1>

        <div class="messages-layout card" style="padding:0;">

            <div class="conversations">

                ${
                    otherUsers.length
                    ? otherUsers.map(renderConversation).join("")
                    : emptyState("💌", "Пока нет сообщений", "Открой профиль пользователя и нажми «Написать».")
                }

            </div>

            <div class="chat">

                ${
                    selectedChatUser
                    ? renderChat(selectedChatUser)
                    : `
                        <div class="empty" style="margin:auto;">
                            <div class="empty-icon">🫧</div>
                            Выбери собеседника
                        </div>
                    `
                }

            </div>

        </div>

    `;

    const chatMessages = document.getElementById("chatMessages");

    if (chatMessages) {
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }
}


function renderConversation(user) {

    return `
        <div
            class="conversation ${selectedChatUser === user.id ? "active" : ""}"
            onclick="openChat('${user.id}')"
        >

            <img src="${user.avatar || defaultAvatar(user.displayName)}">

            <div style="min-width:0;">

                <b style="overflow-wrap:anywhere;">
                    ${escapeHtml(user.displayName)}
                </b>

                <div
                    style="
                        font-size:12px;
                        color:#759aaa;
                        overflow:hidden;
                        text-overflow:ellipsis;
                    "
                >
                    @${escapeHtml(user.username)}
                </div>

            </div>

        </div>
    `;
}


function renderChat(userId) {

    const user = getUser(userId);

    if (!user) return "";

    const messages = db.messages
        .filter(m =>
            (m.from === currentUserId && m.to === userId) ||
            (m.from === userId && m.to === currentUserId)
        )
        .sort((a,b) => a.createdAt - b.createdAt);

    return `

        <div class="chat-header">
            💬 ${escapeHtml(user.displayName)}
        </div>

        <div class="chat-messages" id="chatMessages">

            ${
                messages.length
                ? messages.map(m => `
                    <div class="message ${m.from === currentUserId ? "mine" : ""}">
                        ${escapeHtml(m.text)}
                    </div>
                `).join("")
                : `
                    <div class="empty">
                        <div class="empty-icon">🫧</div>
                        Напиши первое сообщение
                    </div>
                `
            }

        </div>

        <form class="chat-form" onsubmit="sendMessage(event, '${userId}')">

            <input
                id="messageInput"
                maxlength="1000"
                placeholder="Написать сообщение..."
                autocomplete="off"
                required
            >

            <button class="primary" style="width:auto;">
                ➤
            </button>

        </form>

    `;
}


function sendMessage(event, userId) {

    event.preventDefault();

    const input = document.getElementById("messageInput");

    const text = input.value.trim();

    if (!text) return;

    db.messages.push({
        id: uid("message"),
        from: currentUserId,
        to: userId,
        text,
        createdAt: Date.now()
    });

    saveDB();

    selectedChatUser = userId;

    renderMessages();
}


/* ============================================================
   SEARCH
   ============================================================ */

function searchEverything(query) {

    query = query.trim().toLowerCase();

    if (!query) {
        if (currentPage === "feed") renderFeed();
        return;
    }

    const users = db.users.filter(u =>
        u.username.includes(query) ||
        u.displayName.toLowerCase().includes(query)
    );

    const posts = db.posts.filter(p =>
        p.text.toLowerCase().includes(query)
    );

    document.getElementById("page").innerHTML = `

        <h1 class="section-title">
            🔎 Результаты поиска
        </h1>

        <div class="card">

            <h3>Люди</h3>

            ${
                users.length
                ? `<div class="user-list">${users.map(u => renderUserCard(u)).join("")}</div>`
                : `<p style="color:#7899a7;">Никого не найдено.</p>`
            }

        </div>

        <h2 class="section-title">Посты</h2>

        ${
            posts.length
            ? posts.map(renderPost).join("")
            : emptyState("🔎", "Постов не найдено", "")
        }

    `;
}

/* ============================================================
   HELPERS
   ============================================================ */

function emptyState(icon, title, text) {

    return `
        <div class="empty">

            <div class="empty-icon">${icon}</div>

            <b style="font-size:18px;">
                ${escapeHtml(title)}
            </b>

            ${
                text
                ? `<div style="margin-top:6px;">${escapeHtml(text)}</div>`
                : ""
            }

        </div>
    `;
}


function formatDate(timestamp) {

    const date = new Date(timestamp);

    const diff = Date.now() - timestamp;

    if (diff < 60000) return "только что";

    if (diff < 3600000) {
        return Math.floor(diff / 60000) + " мин назад";
    }

    if (diff < 86400000) {
        return Math.floor(diff / 3600000) + " ч назад";
    }

    return date.toLocaleDateString("ru-RU", {
        day: "numeric",
        month: "short",
        year: date.getFullYear() !== new Date().getFullYear()
            ? "numeric"
            : undefined
    });
}


function toast(text) {

    const el = document.getElementById("toast");

    el.textContent = text;
    el.classList.add("show");

    clearTimeout(window.toastTimer);

    window.toastTimer = setTimeout(() => {
        el.classList.remove("show");
    }, 2600);
}


function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function escapeAttr(value) {
    return escapeHtml(value);
}


function escapeSvg(value) {
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&apos;");
}
