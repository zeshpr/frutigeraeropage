<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bubbles — Frutiger Aero Social Network</title>

<style>
:root{
    --blue:#4fc9f5;
    --blue2:#168fd0;
    --cyan:#bff5ff;
    --green:#7ee56d;
    --green2:#35b95b;
    --white:rgba(255,255,255,.92);
    --text:#164c68;
    --muted:#7196a8;
    --shadow:0 12px 35px rgba(35,125,160,.22);
}

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
    color:var(--text);
}

body{
    background:
        radial-gradient(circle at 15% 15%,rgba(255,255,255,.95) 0 5%,transparent 18%),
        radial-gradient(circle at 85% 20%,rgba(255,255,255,.8) 0 4%,transparent 16%),
        linear-gradient(180deg,#72dcff 0%,#b8f5ff 42%,#e9fff7 100%);
    background-attachment:fixed;
    overflow-x:hidden;
}

body:before{
    content:"";
    position:fixed;
    width:420px;
    height:180px;
    top:60px;
    left:-100px;
    border-radius:50%;
    background:rgba(255,255,255,.45);
    filter:blur(25px);
    pointer-events:none;
}

body:after{
    content:"";
    position:fixed;
    width:360px;
    height:150px;
    right:-100px;
    top:180px;
    border-radius:50%;
    background:rgba(255,255,255,.35);
    filter:blur(25px);
    pointer-events:none;
}

button,
input,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

#app{
    min-height:100vh;
}

/* AUTH */

.auth-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
}

.auth-box{
    width:min(480px,100%);
    padding:30px;
    border-radius:35px;
    background:rgba(255,255,255,.86);
    border:2px solid rgba(255,255,255,.9);
    box-shadow:0 25px 70px rgba(29,116,145,.3);
    backdrop-filter:blur(18px);
}

.logo{
    text-align:center;
    font-size:54px;
    font-weight:1000;
    letter-spacing:-4px;
    color:#fff;
    text-shadow:
        0 3px 0 #34a9dc,
        0 7px 15px rgba(26,132,176,.3);
    margin-bottom:5px;
}

.logo-sub{
    text-align:center;
    color:#5d91a8;
    margin-bottom:25px;
}

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;
    margin:0 0 6px 5px;
    font-size:13px;
    font-weight:800;
}

input,
textarea,
select{
    width:100%;
    border:2px solid #c2eaf4;
    background:rgba(255,255,255,.82);
    color:var(--text);
    border-radius:15px;
    padding:12px 14px;
    outline:none;
    transition:.2s;
}

textarea{
    resize:vertical;
    min-height:100px;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#62c9eb;
    box-shadow:0 0 0 4px rgba(98,201,235,.13);
}

.radio-row{
    display:flex;
    gap:10px;
}

.gender-btn{
    flex:1;
    border:2px solid #c6e9f3;
    border-radius:14px;
    padding:11px;
    background:#fff;
    color:var(--text);
}

.gender-btn.active{
    background:#d8f7ff;
    border-color:#5ac9ed;
}

.primary,
.secondary,
.danger{
    border:0;
    border-radius:15px;
    padding:12px 18px;
    font-weight:900;
    color:#fff;
    box-shadow:0 5px 12px rgba(30,120,155,.2);
}

.primary{
    background:linear-gradient(#68dcff,#1b9bd2);
}

.secondary{
    background:linear-gradient(#9cf38b,#42bd62);
}

.danger{
    background:linear-gradient(#ff9caa,#e45870);
}

.primary:hover,
.secondary:hover,
.danger:hover{
    transform:translateY(-1px);
    filter:brightness(1.04);
}

.full{
    width:100%;
}

.auth-switch{
    margin-top:18px;
    text-align:center;
    color:#6d98aa;
}

.auth-switch button{
    border:0;
    background:none;
    color:#168fca;
    font-weight:900;
}

/* HEADER */

.topbar{
    position:sticky;
    top:0;
    z-index:1000;
    height:72px;
    display:flex;
    align-items:center;
    gap:18px;
    padding:10px max(18px,calc((100vw - 1200px)/2));
    background:rgba(255,255,255,.78);
    border-bottom:2px solid rgba(255,255,255,.85);
    backdrop-filter:blur(18px);
    box-shadow:0 5px 25px rgba(30,125,155,.12);
}

.top-logo{
    font-size:31px;
    font-weight:1000;
    letter-spacing:-2px;
    color:#fff;
    text-shadow:0 2px 0 #35a6d5;
    flex-shrink:0;
}

.search{
    flex:1;
    max-width:390px;
    margin-left:auto;
}

.search input{
    border-radius:25px;
    padding:10px 16px;
}

.top-user{
    display:flex;
    align-items:center;
    gap:8px;
    min-width:0;
}

.mini-avatar{
    width:40px;
    height:40px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid #fff;
    box-shadow:0 3px 10px rgba(30,120,150,.2);
    background:#d5f7ff;
}

.top-user span{
    max-width:120px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-weight:900;
}

/* LAYOUT */

.layout{
    width:min(1200px,calc(100% - 30px));
    margin:22px auto 130px;
    display:grid;
    grid-template-columns:220px minmax(0,1fr);
    gap:20px;
}

.sidebar{
    position:sticky;
    top:92px;
    height:max-content;
    padding:13px;
    border-radius:25px;
    background:rgba(255,255,255,.75);
    border:2px solid rgba(255,255,255,.8);
    box-shadow:var(--shadow);
    backdrop-filter:blur(15px);
}

.nav-btn{
    width:100%;
    border:0;
    background:transparent;
    color:#39768e;
    padding:12px 13px;
    margin-bottom:4px;
    border-radius:15px;
    text-align:left;
    font-weight:900;
    transition:.15s;
}

.nav-btn:hover{
    background:rgba(111,218,245,.18);
}

.nav-btn.active{
    color:#fff;
    background:linear-gradient(135deg,#64d9fa,#319fce);
    box-shadow:0 5px 14px rgba(31,151,196,.22);
}

.back-button{
    margin-top:12px;
    border-top:1px solid #c9ebf2;
    padding-top:12px;
}

.content{
    min-width:0;
}

.section-title{
    margin:4px 0 16px;
    font-size:30px;
    letter-spacing:-1px;
}

/* CARDS */

.card{
    width:100%;
    background:rgba(255,255,255,.84);
    border:2px solid rgba(255,255,255,.88);
    border-radius:25px;
    padding:18px;
    margin-bottom:16px;
    box-shadow:var(--shadow);
    backdrop-filter:blur(13px);
    overflow:hidden;
}

.card h3{
    margin-top:0;
}

.empty{
    text-align:center;
    padding:45px 20px;
    color:#7297a8;
}

.empty-icon{
    font-size:48px;
    margin-bottom:10px;
}

/* POSTS */

.post{
    overflow:hidden;
}

.post-head{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
}

.post-author{
    min-width:0;
}

.post-author strong,
.post-author small{
    display:block;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.post-author small{
    color:#82a1ae;
}

.post-content{
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    line-height:1.5;
}

.post-image{
    display:block;
    width:100%;
    max-height:550px;
    object-fit:cover;
    margin-top:13px;

}

.post-actions{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    margin-top:12px;
    padding-top:10px;
    border-top:1px solid #d6edf2;
}

.action-btn{
    border:0;
    background:#effcff;
    color:#4a8499;
    padding:8px 12px;
    border-radius:13px;
    font-weight:800;
}

.action-btn:hover{
    background:#d7f7ff;
}

.action-btn.liked{
    color:#ef5877;
    background:#ffe8ee;
}

.comment-list{
    margin-top:10px;
}

.comment{
    padding:8px 10px;
    border-radius:12px;
    background:#effaff;
    margin-top:6px;
    overflow-wrap:anywhere;
}

.comment strong{
    margin-right:5px;
}

/* PROFILE */

.cover{
    height:250px;
    border-radius:25px;
    background:
        linear-gradient(135deg,rgba(0,190,255,.55),rgba(70,230,150,.45)),
        #8ceeff;
    background-size:cover;
    background-position:center;
    position:relative;
    overflow:hidden;
}

.cover:after{
    content:"";
    position:absolute;
    inset:0;
    background:
        radial-gradient(circle at 20% 40%,rgba(255,255,255,.7) 0 3%,transparent 4%),

    pointer-events:none;
}

.profile-main{
    position:relative;
    padding:0 20px 20px;
}

.profile-avatar{
    width:120px;
    height:120px;
    border-radius:50%;
    object-fit:cover;
    border:6px solid white;
    box-shadow:0 8px 25px rgba(28,112,140,.22);
    margin-top:-60px;
    background:#d8f7ff;
}

.profile-info{
    display:flex;
    justify-content:space-between;
    gap:15px;
    align-items:flex-end;
}

.profile-name{
    min-width:0;
}

.profile-name h1{
    margin:8px 0 2px;
    overflow-wrap:anywhere;
}

.username{
    color:#7599a8;
}

.bio{
    margin:12px 0 0;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
}

.profile-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.stats{
    display:flex;
    gap:25px;
    margin-top:17px;
    flex-wrap:wrap;
}

.stat strong{
    display:block;
    font-size:20px;
}

.stat span{
    color:#789aaa;
    font-size:12px;
}

/* FRIENDS */

.friend-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:13px;
}

.friend-card{
    padding:15px;
    border-radius:20px;
    background:#f1fcff;
    text-align:center;
    border:2px solid #d9f4f8;
    overflow:hidden;
}

.friend-card img{
    width:75px;
    height:75px;
    border-radius:50%;
    object-fit:cover;
}

.friend-card h4{
    margin:8px 0 2px;
    overflow:hidden;
    text-overflow:ellipsis;
}

.friend-card p{
    color:#7c9daa;
    margin:0 0 10px;
    font-size:12px;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* MESSAGES */

.messages-layout{
    display:grid;
    grid-template-columns:260px minmax(0,1fr);
    min-height:600px;
    overflow:hidden;
}

.conversation-list{
    border-right:2px solid #d5eef3;
}

.conversation{
    display:flex;
    gap:9px;
    align-items:center;
    padding:10px;
    cursor:pointer;
    border-radius:14px;
}

.conversation:hover,
.conversation.active{
    background:#e4faff;
}

.conversation-info{
    min-width:0;
}

.conversation-info strong,
.conversation-info small{
    display:block;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.conversation-info small{
    color:#7a9ca9;
}

.chat{
    display:flex;
    flex-direction:column;
    min-width:0;
}

.chat-header{
    padding:10px 14px;
    border-bottom:2px solid #d5eef3;
    font-weight:900;
}

.chat-messages{
    flex:1;
    padding:15px;
    min-height:400px;
    max-height:500px;
    overflow-y:auto;
}

.message{
    max-width:75%;
    padding:10px 13px;
    border-radius:17px;
    margin-bottom:8px;
    overflow-wrap:anywhere;
}

.message.me{
    margin-left:auto;
    background:#c9f4ff;
    border-bottom-right-radius:5px;
}

.message.them{
    background:#edfaff;
    border-bottom-left-radius:5px;
}

.message small{
    display:block;
    margin-top:4px;
    color:#82a1ad;
    font-size:10px;
}

.chat-input{
    display:flex;
    gap:8px;
    padding:12px;
    border-top:2px solid #d5eef3;
}

.chat-input input{
    flex:1;
}

/* MUSIC */

.music-card{
    background:rgba(255,255,255,.86);
    border:2px solid rgba(255,255,255,.9);
    border-radius:22px;
    padding:14px;
    margin-bottom:13px;
    box-shadow:0 7px 20px rgba(40,120,145,.12);
}

.music-row{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
}

.music-cover{
    width:68px;
    height:68px;
    border-radius:17px;
    object-fit:cover;
    flex-shrink:0;
    background:#d5f7ff;
}

.music-info{
    flex:1;
    min-width:0;
}

.music-title{
    font-size:17px;
    font-weight:900;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.music-artist{
    color:#779aa8;
    font-size:12px;
    margin-top:4px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.music-row button{
    flex-shrink:0;
    border:0;
    border-radius:13px;
    padding:9px 11px;
    background:#dff9ff;
    color:#267b99;
    font-weight:900;
}

.music-row button:hover{
    background:#c8f3fc;
}

/* PLAYER */

.global-player{
    position:fixed;
    left:50%;
    bottom:18px;
    transform:translateX(-50%);
    z-index:9999;
    width:min(760px,calc(100% - 24px));
    display:flex;
    align-items:center;
    gap:12px;
    padding:11px 13px;
    background:rgba(255,255,255,.94);
    backdrop-filter:blur(20px);
    border:2px solid rgba(255,255,255,.95);
    border-radius:22px;
    box-shadow:0 15px 45px rgba(25,115,150,.27);
}

.global-player-info{
    display:flex;
    align-items:center;
    gap:10px;
    width:220px;
    min-width:0;
}

.global-player-info img{
    width:48px;
    height:48px;
    border-radius:14px;
    object-fit:cover;
    flex-shrink:0;
}

.global-player-text{
    min-width:0;
}

.global-player-text div{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.global-player-text div:first-child{
    font-weight:900;
}

.global-player-text div:last-child{
    color:#7899a7;
    font-size:12px;
}

.global-player audio{
    flex:1;
    min-width:0;
}

.global-player > button{
    width:38px;
    height:38px;
    padding:0;
    border:0;
    border-radius:12px;
    background:#ffe9ef;
    color:#d95774;
    font-weight:900;
}

/* PROFILE EDIT */

.edit-preview{
    display:flex;
    align-items:center;
    gap:15px;
    margin-bottom:17px;
}

.edit-preview img{
    width:80px;
    height:80px;
    border-radius:50%;
    object-fit:cover;
}

/* TOAST */

#toastContainer{
    position:fixed;
    right:18px;
    bottom:18px;
    z-index:20000;
    display:flex;
    flex-direction:column;
    gap:8px;
    pointer-events:none;
}

.toast{
    max-width:min(350px,calc(100vw - 36px));
    background:rgba(255,255,255,.95);
    border:2px solid white;
    box-shadow:0 10px 30px rgba(30,120,150,.2);
    padding:12px 15px;
    border-radius:16px;
    color:#316c83;
    font-weight:800;
    animation:toastIn .2s ease;

@keyframes toastIn{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{

        transform:none;
    }

/* RESPONSIVE */

@media(max-width:850px){

    .layout{
        grid-template-columns:1fr;
    }

    .sidebar{
        position:sticky;
        top:72px;
        z-index:500;

        gap:5px;
        overflow-x:auto;
        padding:7px;
    }

    .nav-btn{
        width:auto;
        white-space:nowrap;
        margin:0;
    }

    .back-button{
        margin:0;
        padding:0;
        border:0;
    }

    .search{
        display:none;
    }

    .topbar{
        padding:10px 13px;
    }

    .top-user{
        margin-left:auto;
    }

    .messages-layout{
        grid-template-columns:1fr;
    }

    .conversation-list{
        border-right:0;
        border-bottom:2px solid #d5eef3;
        max-height:180px;
        overflow-y:auto;
    }

    .chat-messages{
        min-height:300px;
    }

    .profile-info{
        flex-direction:column;
        align-items:flex-start;
    }

@media(max-width:600px){

    .layout{
        width:calc(100% - 14px);
        margin-top:10px;
    }

    .card{
        border-radius:20px;
        padding:14px;
    }

    .section-title{
        font-size:25px;
    }

    .cover{
        height:180px;
    }

    .profile-avatar{
        width:95px;
        height:95px;
        margin-top:-48px;
    }

    .profile-main{
        padding:0 13px 15px;
    }

    .top-logo{
        font-size:28px;
    }

    .top-user span{
        display:none;
    }

    .global-player{
        bottom:8px;
        flex-wrap:wrap;
    }

    .global-player-info{
        width:calc(100% - 50px);
    }

    .global-player audio{
        flex-basis:100%;
        width:100%;
    }

    .friend-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
    }

}
</style>
</head>

<body>

<div id="app"></div>

<!-- GLOBAL AUDIO PLAYER: НЕ УДАЛЯЕТСЯ ПРИ ПЕРЕКЛЮЧЕНИИ СТРАНИЦ -->
<div id="globalPlayer" class="global-player hidden">

    <div class="global-player-info">

        <img id="globalPlayerCover" src="" alt="">

        <div class="global-player-text">
            <div id="globalPlayerTitle">Ничего не играет</div>
            <div id="globalPlayerArtist"></div>
        </div>

    </div>

    <audio id="globalAudio" controls preload="metadata"></audio>

    <button onclick="closeMusicPlayer()" title="Закрыть">
        ✕
    </button>

</div>

<div id="toastContainer"></div>

<script>
/* ============================================================
   BUBBLES
   Local prototype social network
   ============================================================ */

const DB_KEY = "bubbles_social_database_v7";
const SESSION_KEY = "bubbles_current_user_v7";

const MAX_MUSIC_SIZE = 15 * 1024 * 1024;

let db = {
    users: [],
    posts: [],
    comments: [],
    friends: [],
    messages: [],
    music: []
};

let currentUserId = localStorage.getItem(SESSION_KEY) || null;
let currentPage = "feed";
let selectedProfileId = null;
let selectedChatId = null;
let genderValue = "female";

let musicDB = null;
let globalAudioURL = null;
let currentlyPlayingMusicId = null;


/* ============================================================
   INDEXED DB
   ============================================================ */

function openMusicDB(){

    return new Promise((resolve,reject)=>{

        const request = indexedDB.open(
            "bubbles_music_storage",
            1
        );

        request.onupgradeneeded = event => {

            const database = event.target.result;

            if(!database.objectStoreNames.contains("tracks")){

                database.createObjectStore("tracks",{
                    keyPath:"id"
                });

            }

        };

        request.onsuccess = event => {

            musicDB = event.target.result;

            resolve(musicDB);

        };

        request.onerror = () => {
            reject(request.error);
        };

    });

}


function saveAudioFile(id,file){

    return new Promise((resolve,reject)=>{

        const tx = musicDB.transaction(
            "tracks",
            "readwrite"
        );

        tx.objectStore("tracks").put({
            id:id,
            blob:file
        });

        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);

    });

}


function getAudioFile(id){

    return new Promise((resolve,reject)=>{

        const tx = musicDB.transaction(
            "tracks",
            "readonly"
        );

        const request =
            tx.objectStore("tracks").get(id);

        request.onsuccess = () => {

            resolve(
                request.result
                ? request.result.blob
                : null
            );

        };

        request.onerror = () => {
            reject(request.error);
        };

    });

}


function deleteAudioFile(id){

    return new Promise((resolve,reject)=>{

        const tx = musicDB.transaction(
            "tracks",
            "readwrite"
        );

        tx.objectStore("tracks").delete(id);

        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);

    });

}


/* ============================================================
   DATABASE
   ============================================================ */

function loadDB(){

    try{

        const saved =
            localStorage.getItem(DB_KEY);

        if(saved){

            const parsed = JSON.parse(saved);

            db = {
                users:parsed.users || [],
                posts:parsed.posts || [],
                comments:parsed.comments || [],
                friends:parsed.friends || [],
                messages:parsed.messages || [],
                music:parsed.music || []
            };

        }

    }catch(error){

        console.error(error);

    }

}

            DB_KEY,
            JSON.stringify(db)

        toast(

/* ============================================================

function uid(prefix="id"){

    return prefix +
        "_" +
        Date.now().toString(36) +
        "_" +
        Math.random()
        .toString(36)
        .slice(2,8);

}


function escapeHtml(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


function getUser(id){

    return db.users.find(
        user => user.id === id
    );

}


function getCurrentUser(){

    return getUser(currentUserId);

}


function isFriend(userId){

    return db.friends.some(
        f =>
            (f.user1 === currentUserId && f.user2 === userId) ||
            (f.user2 === currentUserId && f.user1 === userId)
    );

}

function timeAgo(timestamp){

    const diff =
        Date.now() - timestamp;

    const sec =
        Math.floor(diff / 1000);

    if(sec < 60)
        return "только что";

    const min =
        Math.floor(sec / 60);

    if(min < 60)
        return min + " мин.";

    const hours =
        Math.floor(min / 60);

    if(hours < 24)
        return hours + " ч.";

    const days =
        Math.floor(hours / 24);

    if(days < 30)
        return days + " д.";

    return new Date(timestamp)
        .toLocaleDateString("ru-RU");

}


function toast(text){

    const container =
        document.getElementById("toastContainer");

    const el =
        document.createElement("div");

    el.className = "toast";

    el.textContent = text;

    container.appendChild(el);

    setTimeout(()=>{
        el.remove();
    },3000);

}


function fileToDataURL(file){

    return new Promise((resolve,reject)=>{

        const reader =
            new FileReader();

        reader.onload =
            e => resolve(e.target.result);

        reader.onerror = reject;

        reader.readAsDataURL(file);

    });

}

            <div class="empty-icon">${icon}</div>
            <strong>${escapeHtml(title)}</strong>
            <p>${escapeHtml(text)}</p>
        </div>
    `;

}

async function createPost(){

    const text =
        document
        .getElementById("postText")
        .value
        .trim();

    const file =
        document
        .getElementById("postImage")
        .files[0];


    if(!text && !file){

        toast("Добавь текст или изображение.");

        return;

    }


    let image = "";

    if(file){

        if(!file.type.startsWith("image/")){

            toast("Можно загружать только изображения.");

            return;

        }

        if(file.size > 8 * 1024 * 1024){

            toast("Изображение слишком большое. Максимум 8 МБ.");

            return;

        }

        image =
            await fileToDataURL(file);

    }


    db.posts.push({

        id:uid("post"),

        authorId:currentUserId,

        text,

        image,

        likes:[],

        createdAt:Date.now()

    });


    saveDB();

    toast("Пост опубликован!");

    renderFeed();

}


function toggleLike(postId){

    const post =
        db.posts.find(
            p => p.id === postId
        );

    if(!post) return;


    if(!post.likes)
        post.likes = [];


    const index =
        post.likes.indexOf(
            currentUserId
        );


    if(index >= 0){

        post.likes.splice(index,1);

    }else{

        post.likes.push(
            currentUserId
        );

    }


    saveDB();

    renderFeed();

}


function addComment(postId){

    const input =
        document.getElementById(
            "comment-" + postId
        );


    if(!input) return;


    const text =
        input.value.trim();


    if(!text) return;


    db.comments.push({

        id:uid("comment"),

        postId,

        authorId:currentUserId,

        text,

        createdAt:Date.now()

    });


    saveDB();

    renderFeed();

}


function focusComment(postId){

    const input =
        document.getElementById(
            "comment-" + postId
        );

    if(input){

        input.focus();

        input.scrollIntoView({
            behavior:"smooth",
            block:"center"
        });

    }

}


async function sharePost(postId){

    const post =
        db.posts.find(
            p => p.id === postId
        );

    if(!post) return;


    const author =
        getUser(post.authorId);


    const text =
        `Пост ${author?.displayName || ""} в bubbles`;


    if(
        navigator.share
    ){

        try{

            await navigator.share({
                title:"bubbles",
                text
            });

        }catch{}

    }else{

        try{

            await navigator.clipboard.writeText(
                location.href
            );

            toast("Ссылка скопирована.");

        }catch{

            toast("Не удалось скопировать ссылку.");

        }

    }

}


function deletePost(postId){

    const post =
        db.posts.find(
            p => p.id === postId
        );


    if(!post || post.authorId !== currentUserId)
        return;


    if(!confirm("Удалить пост?"))
        return;


    db.posts =
        db.posts.filter(
            p => p.id !== postId
        );


    db.comments =
        db.comments.filter(
            c => c.postId !== postId
        );


    saveDB();

    renderFeed();

}

function previewAvatar(input){

    const file =
        input.files[0];

    if(!file) return;


    if(!file.type.startsWith("image/")){

        toast("Выбери изображение.");

        input.value = "";

        return;

    }


    const reader =
        new FileReader();


    reader.onload = e => {

        document
            .getElementById("editAvatarPreview")
            .src = e.target.result;

    };


    reader.readAsDataURL(file);

}


async function saveProfile(){

    const user =
        getCurrentUser();


    const username =
        document
        .getElementById("editUsername")
        .value
        .trim()
        .toLowerCase();


    const displayName =
        document
        .getElementById("editName")
        .value
        .trim();


    const bio =
        document
        .getElementById("editBio")
        .value
        .trim();


    if(!username || !displayName){

        toast("Заполни имя и юзернейм.");

        return;

    }


    const taken =
        db.users.some(
            u =>
                u.id !== user.id &&
                u.username === username
        );


    if(taken){

        toast("Этот юзернейм уже занят.");

        return;

    }


    const avatarFile =
        document
        .getElementById("editAvatar")
        .files[0];


    const coverFile =
        document
        .getElementById("editCover")
        .files[0];


    if(avatarFile){

        if(avatarFile.size > 5 * 1024 * 1024){

            toast("Аватар слишком большой. Максимум 5 МБ.");

            return;

        }

        user.avatar =
            await fileToDataURL(avatarFile);

    }


    if(coverFile){

        if(coverFile.size > 8 * 1024 * 1024){

            toast("Обложка слишком большая. Максимум 8 МБ.");

            return;

        }

        user.cover =
            await fileToDataURL(coverFile);

    }


    user.username =
        username;

    user.displayName =
        displayName;

    user.bio =
        bio;


    saveDB();

    toast("Профиль обновлён.");

    renderApp();

}

    const index =
        db.friends.findIndex(

                (f.user2 === currentUserId && f.user1 === userId)
        );


    if(index >= 0){

function openChat(userId){

    selectedChatId =
        userId;

    currentPage =
        "messages";

}


function renderMessages(){

    const friends =
        db.friends
        .filter(
            f =>
                f.user1 === currentUserId ||
                f.user2 === currentUserId
        );


    const users =
        friends
        .map(
            f =>
                getUser(
                    f.user1 === currentUserId
                    ? f.user2
                    : f.user1
                )
        )
        .filter(Boolean);


    if(
        !selectedChatId &&
        users.length
    ){

        selectedChatId =
            users[0].id;

    }


    document.getElementById("page").innerHTML = `

        <h1 class="section-title">
            💬 Сообщения
        </h1>


        <div class="card messages-layout">

            <div class="conversation-list">

                ${
                    users.length
                    ? users.map(renderConversation).join("")
                    : `
                        <div class="empty">
                            Нет друзей для переписки.
                        </div>
                    `
                }

            </div>


            <div class="chat">

                ${
                    selectedChatId
                    ? renderChat(selectedChatId)
                    : `
                        <div class="empty">
                            <div class="empty-icon">
                                💬
                            </div>

                            Выбери друга.
                        </div>
                    `
                }

            </div>

        </div>

    `;

}


function renderConversation(user){

    const messages =
        db.messages
        .filter(
            m =>
                (m.from === currentUserId &&
                 m.to === user.id) ||
                (m.from === user.id &&
                 m.to === currentUserId)
        )
        .sort(
            (a,b) =>
                b.createdAt-a.createdAt
        );


    const last =
        messages[0];


    return `

        <div
            class="conversation ${selectedChatId === user.id ? "active" : ""}"
            onclick="openChat('${user.id}')"
        >

            <img
                class="mini-avatar"
                src="${user.avatar || defaultAvatar()}"
            >

            <div class="conversation-info">

                <strong>
                    ${escapeHtml(user.displayName)}
                </strong>

                <small>
                    ${
                        last
                        ? escapeHtml(last.text)
                        : "Нет сообщений"
                    }
                </small>

            </div>

        </div>

    `;

}


function renderChat(userId){

    const user =
        getUser(userId);


    const messages =
        db.messages
        .filter(
            m =>
                (m.from === currentUserId &&
                 m.to === userId) ||
                (m.from === userId &&
                 m.to === currentUserId)
        )
        .sort(
            (a,b) =>
                a.createdAt-b.createdAt
        );


    return `

        <div class="chat-header">

            <img
                class="mini-avatar"
                src="${user.avatar || defaultAvatar()}"
                style="width:30px;height:30px;vertical-align:middle;"
            >

            ${escapeHtml(user.displayName)}

        </div>


        <div
            class="chat-messages"
            id="chatMessages"
        >

            ${
                messages.length
                ? messages.map(messageBubble).join("")
                : `
                    <div class="empty">
                        Начни переписку.
                    </div>
                `
            }

        </div>


        <form
            class="chat-input"
            onsubmit="sendMessage(event,'${userId}')"
        >

            <input
                id="messageInput"
                maxlength="1000"
                autocomplete="off"
                placeholder="Написать сообщение..."
                required
            >

            <button class="primary">
                Отправить
            </button>

        </form>

    `;

}


function messageBubble(message){

    return `

        <div class="message ${
            message.from === currentUserId
            ? "me"
            : "them"
        }">

            ${escapeHtml(message.text)}

            <small>
                ${new Date(message.createdAt)
                    .toLocaleTimeString(
                        "ru-RU",
                        {
                            hour:"2-digit",
                            minute:"2-digit"
                        }
                    )}
            </small>

        </div>

    `;

}


function sendMessage(event,userId){

    event.preventDefault();


    const input =
        document.getElementById(
            "messageInput"
        );


    const text =
        input.value.trim();


    if(!text) return;


    db.messages.push({

        id:uid("message"),

        from:currentUserId,

        to:userId,

        text,

        createdAt:Date.now()

    });


    saveDB();

    renderMessages();

    setTimeout(()=>{

        const box =
            document.getElementById(
                "chatMessages"
            );

        if(box){

            box.scrollTop =
                box.scrollHeight;

        }

    },20);

}

async function uploadMusic(){

    const title =
        document
        .getElementById("musicTitle")
        .value
        .trim();


    const audioFile =
        document
        .getElementById("musicFile")
        .files[0];


    const coverFile =
        document
        .getElementById("musicCover")
        .files[0];


    if(!title){

        toast("Укажи название трека.");

        return;

    }


    if(!audioFile){

        toast("Выбери MP3-файл.");

        return;

    }


    if(audioFile.size > MAX_MUSIC_SIZE){

        toast("MP3 слишком большой. Максимум — 15 МБ.");

        return;

    }


    const isMP3 =
        audioFile.type === "audio/mpeg" ||
        audioFile.name
        .toLowerCase()
        .endsWith(".mp3");


    if(!isMP3){

        toast("Можно загружать только MP3.");

        return;

    }


    if(!musicDB){

        try{

            await openMusicDB();

        }catch{

            toast("IndexedDB недоступна.");

            return;

        }

    }


    if(coverFile){

        if(!coverFile.type.startsWith("image/")){

            toast("Обложка должна быть изображением.");

            return;

        }

        if(coverFile.size > 5 * 1024 * 1024){

            toast("Обложка слишком большая. Максимум 5 МБ.");

            return;

        }

    }


    const musicId =
        uid("music");


    try{

        await saveAudioFile(
            musicId,
            audioFile
        );


        let cover = "";

        if(coverFile){

            cover =
                await fileToDataURL(
                    coverFile
                );

        }


        db.music.push({

            id:musicId,

            authorId:currentUserId,

            title,

            cover,

            audioId:musicId,

            createdAt:Date.now()

        });


        saveDB();


        document
            .getElementById("musicTitle")
            .value = "";

        document
            .getElementById("musicFile")
            .value = "";

        document
            .getElementById("musicCover")
            .value = "";


        toast("Трек опубликован 🎵");

        renderMusic();

    }catch(error){

        console.error(error);

        try{

            await deleteAudioFile(
                musicId
            );

        }catch{}

        toast("Не удалось сохранить MP3.");

    }

}


async function playMusic(musicId){

    const music =
        db.music.find(
            m => m.id === musicId
        );


    if(!music){

        toast("Трек не найден.");

        return;

    }


    const audio =
        document.getElementById(
            "globalAudio"
        );


    if(
        currentlyPlayingMusicId === musicId &&
        !audio.paused
    ){

        return;

    }


    let url = "";


    if(music.audioId){

        try{

            const blob =
                await getAudioFile(
                    music.audioId
                );


            if(!blob){

                toast("Файл трека не найден.");

                return;

            }


            if(globalAudioURL){

                URL.revokeObjectURL(
                    globalAudioURL
                );

            }


            globalAudioURL =
                URL.createObjectURL(
                    blob
                );


            url =
                globalAudioURL;

        }catch(error){

            console.error(error);

            toast("Не удалось открыть MP3.");

            return;

        }

    }else if(music.audio){

        url =
            music.audio;

    }


    if(!url){

        toast("Аудиофайл отсутствует.");

        return;

    }


    currentlyPlayingMusicId =
        musicId;


    audio.src =
        url;


    document
        .getElementById(
            "globalPlayerCover"
        )
        .src =
        music.cover ||
        defaultMusicCover();


    const author =
        getUser(music.authorId);


    document
        .getElementById(
            "globalPlayerTitle"
        )
        .textContent =
        music.title;


    document
        .getElementById(
            "globalPlayerArtist"
        )
        .textContent =
        author
        ? "@" + author.username
        : "Unknown";


    document
        .getElementById(
            "globalPlayer"
        )
        .classList
        .remove("hidden");


    try{

        await audio.play();

    }catch(error){

        console.log(
            "Браузер ожидает действие пользователя.",
            error
        );

    }

}


function closeMusicPlayer(){

    const audio =
        document.getElementById(
            "globalAudio"
        );


    audio.pause();

    audio.removeAttribute(
        "src"
    );

    audio.load();


    currentlyPlayingMusicId =
        null;


    document
        .getElementById(
            "globalPlayer"
        )
        .classList
        .add("hidden");


    if(globalAudioURL){

        URL.revokeObjectURL(
            globalAudioURL
        );

        globalAudioURL =
            null;

    }

}


async function deleteMusic(id){

    const music =
        db.music.find(
            m => m.id === id
        );


    if(!music)
        return;


    if(music.authorId !== currentUserId)
        return;


    if(
        !confirm(
            "Удалить этот трек?"
        )
    ){

        return;

    }


    if(
        currentlyPlayingMusicId === id
    ){

        closeMusicPlayer();

    }


    if(music.audioId){

        try{

            await deleteAudioFile(
                music.audioId
            );

        }catch(error){

            console.error(error);

        }

    }


    db.music =
        db.music.filter(
            m => m.id !== id
        );


    saveDB();

    toast("Трек удалён.");

    renderMusic();

}

function searchUsers(value){

        value
        .trim()
        .toLowerCase();


    if(!query){

        if(currentPage === "search")
            navigate("feed");

        return;

    }


    currentPage =
        "search";


    renderSearchResults(
        query

}


function renderSearchResults(query){

    const users =
        db.users.filter(
            user =>
                user.id !== currentUserId &&
                (
                    user.username
                    .toLowerCase()
                    .includes(query) ||
                    user.displayName
                    .toLowerCase()
                    .includes(query)

        );


    document.getElementById("page").innerHTML = `

            🔎 Результаты поиска

            users.length
            ? `

                "🔎",
                "Ничего не найдено",

    `;

}
