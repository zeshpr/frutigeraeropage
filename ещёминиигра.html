<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aero Bubble Pop Plus</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(180deg, #0051a8 0%, #29abe2 45%, #76d211 100%);
        }

        #game-container { position: relative; width: 100vw; height: 100vh; }

        /* Интерфейс */
        .glass-panel {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            color: white;
            padding: 15px;
            position: absolute;
            z-index: 100;
        }

        #ui-top { top: 20px; left: 20px; min-width: 150px; }

        .btn-back {
            top: 20px; right: 20px; cursor: pointer;
            text-decoration: none; display: flex; align-items: center;
            transition: 0.3s; font-weight: bold;
        }
        .btn-back:hover { background: rgba(255, 255, 255, 0.4); transform: scale(1.05); }

        /* Пузырек */
        .bubble {
            position: absolute; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), rgba(255,255,255,0.1) 70%);
            box-shadow: inset -2px -2px 10px rgba(0,0,0,0.1), 0 5px 15px rgba(255,255,255,0.3);
            border: 1px solid rgba(255,255,255,0.5);
            cursor: pointer;
        }

        /* Экран проигрыша */
        #game-over {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); text-align: center;
            width: 300px;
        }

        .btn-restart {
            margin-top: 15px; padding: 10px 20px; border-radius: 20px;
            border: none; background: #fff; color: #0051a8;
            cursor: pointer; font-weight: bold; font-size: 16px;
        }

        .heart { color: #ff4d4d; font-size: 20px; }
    </style>
</head>
<body>

    <a href="ubble.html" class="glass-panel btn-back">← Назад</a>

    <div id="ui-top" class="glass-panel">
        <div>Счет: <span id="score">0</span></div>
        <div id="lives-container">Жизни: <span class="heart">❤❤❤</span></div>
    </div>

    <div id="game-over" class="glass-panel">
        <h2>Игра окончена!</h2>
        <p>Ваш результат: <span id="final-score">0</span></p>
        <button class="btn-restart" onclick="location.reload()">Играть снова</button>
    </div>

    <div id="game-container"></div>

    <script>
        // ==========================================
        // НАСТРОЙКИ ЗВУКА
        // Поменяйте название файла ниже на ваше:
        const gameOverSound = 'gameover.mp3'; 	
        // ==========================================

        const container = document.getElementById('game-container');
        const scoreEl = document.getElementById('score');
        const livesEl = document.querySelector('.heart');
        const gameOverScreen = document.getElementById('game-over');
        
        let score = 0;
        let lives = 3;
        let gameActive = true;
        let audioCtx = null;

        // Инициализация звука
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                playBackgroundMusic();
            }
        }

        // Звук лопания (синтезированный)
        function playPopSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        // Фоновая музыка (процедурная)
        function playBackgroundMusic() {
            const notes = [261.63, 329.63, 392.00, 523.25]; 
            setInterval(() => {
                if (!gameActive) return; // Останавливаем фоновую, когда игра окончена
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.frequency.value = notes[Math.floor(Math.random() * notes.length)];
                gain.gain.setValueAtTime(0, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.05, audioCtx.currentTime + 2);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 4);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 4);
            }, 3000);
        }

        function createBubble() {
            if (!gameActive) return;
            
            const bubble = document.createElement('div');
            const size = Math.random() * 50 + 40;
            const posX = Math.random() * (window.innerWidth - size);
            
            bubble.className = 'bubble';
            bubble.style.width = size + 'px';
            bubble.style.height = size + 'px';
            bubble.style.left = posX + 'px';
            bubble.style.bottom = '-100px';

            bubble.addEventListener('mousedown', () => {
                if (!gameActive) return;
                initAudio();
                score++;
                scoreEl.innerText = score;
                playPopSound();
                bubble.remove();
            });

            container.appendChild(bubble);

            const animation = bubble.animate([
                { bottom: '-100px' },
                { bottom: window.innerHeight + 'px' }
            ], {
                duration: Math.random() * 3000 + 4000,
                easing: 'linear'
            });

            animation.onfinish = () => {
                if (bubble.parentElement && gameActive) {
                    lives--;
                    updateLives();
                    bubble.remove();
                }
            };
        }

        function updateLives() {
            livesEl.innerText = '❤'.repeat(lives);
            if (lives <= 0) {
                gameActive = false;
                document.getElementById('final-score').innerText = score;
                gameOverScreen.style.display = 'block';
                container.innerHTML = '';
                
                // ПРОИГРЫВАНИЕ MP3 ПРИ СМЕРТИ
                try {
                    const audio = new Audio(gameOverSound);
                    audio.play().catch(e => console.log("Браузер заблокировал автоплей или файл не найден:", e));
                } catch (e) {
                    console.error("Ошибка аудио:", e);
                }
            }
        }

        setInterval(createBubble, 1000);
        window.addEventListener('mousedown', initAudio, { once: true });
    </script>
</body>
</html>
