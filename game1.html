<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Aero Bubble Pop - Pro Edition</title>
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.3);
            --border: rgba(255, 255, 255, 0.5);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(180deg, #0078d7 0%, #a2d9ff 50%, #76b900 100%);
            color: white;
        }

        /* Универсальный стиль кнопок Frutiger Aero */
        button {
            background: linear-gradient(180deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.1) 100%);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 10px 25px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            backdrop-filter: blur(5px);
            transition: 0.3s;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        button:hover {
            background: rgba(255,255,255,0.5);
            transform: translateY(-2px);
        }

        /* Экраны */
        .screen {
            position: absolute; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 100; background: rgba(0, 120, 215, 0.2);
            backdrop-filter: blur(15px);
        }

        .hidden { display: none !important; }

        /* Игровой интерфейс */
        #ui-layer {
            position: absolute; top: 20px; width: 100%;
            display: flex; justify-content: space-around;
            pointer-events: none; z-index: 50;
        }

        .stats-panel {
            background: var(--glass); padding: 5px 20px;
            border-radius: 30px; border: 1px solid var(--border);
            pointer-events: auto;
        }

        /* Пузырек */
        .bubble {
            position: absolute; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), rgba(255,255,255,0.1) 60%);
            border: 1px solid rgba(255,255,255,0.4);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            cursor: pointer;
        }

        h1 { font-size: 48px; text-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

    <div id="main-menu" class="screen">
        <h1>Aero Bubbles</h1>
        <button onclick="startGame()">Начать игру</button><br>
        <button onclick="location.href='ubble.html'">Вернуться назад</button><br>
        <button id="music-toggle" onclick="toggleMusic()">🎵 Музыка: Выкл</button>
    </div>

    <div id="pause-screen" class="screen hidden">
        <h1>Пауза</h1>
        <button onclick="togglePause()">Продолжить</button>
    </div>

    <div id="game-over" class="screen hidden">
        <h1 style="color: #ff4d4d;">Игра окончена!</h1>
        <p id="final-score" style="font-size: 24px;">Счет: 0</p>
        <button onclick="startGame()">Начать заново</button><br>
        <button onclick="showMainMenu()">Вернуться на главное</button>
    </div>

    <div id="ui-layer" class="hidden">
        <div class="stats-panel">Счет: <span id="score">0</span></div>
        <div class="stats-panel">Жизни: <span id="lives">3</span></div>
        <button onclick="togglePause()" style="pointer-events: auto;">⏸</button>
    </div>

    <div id="game-container"></div>

    <script>
    // --- НАСТРОЙКИ ---
    const MP3_URL = 'gameover.mp3'; // ЗАМЕНИ НА СВОЁ НАЗВАНИЕ ФАЙЛА
    
    let score = 0;
    let lives = 3;
    let isPaused = false;
    let gameActive = false;
    let spawnInterval;
    
    // --- АУДИО ЛОГИКА ---
    const bgMusic = new Audio(gameover.mp3);
    bgMusic.loop = true;
    let musicEnabled = false;

    function toggleMusic() {
        const btn = document.getElementById('music-toggle');
        if (!musicEnabled) {
            // Пытаемся включить музыку
            bgMusic.play().then(() => {
                musicEnabled = true;
                btn.innerText = `🎵 Музыка: Вкл`;
                console.log("Музыка запущена успешно");
            }).catch(e => {
                console.error("Ошибка: файл не найден или заблокирован", e);
                alert("Не удалось включить звук. Проверь, лежит ли файл " + MP3_URL + " в папке с игрой.");
            });
        } else {
            // Выключаем
            bgMusic.pause();
            musicEnabled = false;
            btn.innerText = `🎵 Музыка: Выкл`;
        }
    }

    // --- УПРАВЛЕНИЕ ЭКРАНАМИ ---
    function showMainMenu() {
        hideAllScreens();
        document.getElementById('main-menu').classList.remove('hidden');
    }

    function hideAllScreens() {
        document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
        document.getElementById('ui-layer').classList.add('hidden');
    }

    // --- ЛОГИКА ИГРЫ ---
    function startGame() {
        score = 0;
        lives = 3;
        gameActive = true;
        isPaused = false;
        
        document.getElementById('score').innerText = score;
        document.getElementById('lives').innerText = lives;
        document.getElementById('game-container').innerHTML = ''; // Очистка старых пузырьков
        
        hideAllScreens();
        document.getElementById('ui-layer').classList.remove('hidden');
        
        clearInterval(spawnInterval);
        spawnInterval = setInterval(createBubble, 1000); // Появление каждые 1 сек
    }

    function createBubble() {
        if (isPaused || !gameActive) return;

        const bubble = document.createElement('div');
        const size = Math.random() * 50 + 40;
        bubble.className = 'bubble';
        bubble.style.width = size + 'px';
        bubble.style.height = size + 'px';
        bubble.style.left = Math.random() * (window.innerWidth - size) + 'px';
        bubble.style.bottom = '-100px';
        
        let pos = -100;
        let speed = Math.random() * 2 + 1.5; // Скорость подъема

        bubble.onclick = (e) => {
            if (isPaused) return;
            score += 10;
            document.getElementById('score').innerText = score;
            bubble.remove();
            e.stopPropagation(); // Чтобы клик не прошел сквозь пузырек
        };

        document.getElementById('game-container').appendChild(bubble);
        
        // Движение конкретного пузырька
        const moveInterval = setInterval(() => {
            if (!isPaused && gameActive) {
                pos += speed;
                bubble.style.bottom = pos + 'px';

                // Если пропустили пузырек
                if (pos > window.innerHeight) {
                    lives--;
                    document.getElementById('lives').innerText = lives;
                    bubble.remove();
                    clearInterval(moveInterval);
                    if (lives <= 0) gameOver();
                }
            }
            // Если игра закончилась, удаляем лишнее
            if (!gameActive) {
                bubble.remove();
                clearInterval(moveInterval);
            }
        }, 16);
    }

    function togglePause() {
        if (!gameActive) return;
        isPaused = !isPaused;
        document.getElementById('pause-screen').classList.toggle('hidden');
    }

    function gameOver() {
        gameActive = false;
        clearInterval(spawnInterval);
        document.getElementById('final-score').innerText = `Ваш результат: ${score}`;
        document.getElementById('game-over').classList.remove('hidden');
        document.getElementById('ui-layer').classList.add('hidden');
    }
</script>
</body>
</html>
